[package]
name = "superii-data-plane"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Bounded resumable transfer service and CLI for Super ii."

[lib]
name = "superii_data_plane"
path = "src/lib.rs"

[[bin]]
name = "superii-transferd"
path = "src/bin/superii-transferd.rs"

[[bin]]
name = "superii"
path = "src/bin/superii.rs"

[dependencies]
axum = { version = "=0.8.9", features = ["http1", "json", "tokio"] }
base64 = "=0.23.1"
bytes = "=1.12.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.6", features = ["derive", "env"] }
futures-util = "=0.3.34"
hex = "=0.4.3"
http-body-util = "=0.1.5"
httpdate = "=1.0.3"
infer = "=0.22.0"
mime_guess = "=2.0.5"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
subtle = "=2.6.1"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
