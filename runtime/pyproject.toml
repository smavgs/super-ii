[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "superii-runtime"
version = "0.1.0"
description = "Offline-first storage, inspection, scanning, and local AI runtime for Super ii."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "LicenseRef-Super-ii-Modified-MIT"
license-files = ["LICENSE"]
dependencies = [
  "cryptography==50.0.2",
  "datasets==5.1.0",
  "ddgs==9.16.0",
  "fastapi==0.161.1",
  "gguf==0.19.0",
  "hf-xet==1.7.0",
  "huggingface-hub==1.29.0",
  "httpx==0.28.1",
  "nbformat==5.11.1",
  "pillow==13.0.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.1",
  "pyarrow==26.0.0",
  "python-multipart==0.0.32",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "tiktoken==0.14.0",
  "tokenizers==0.23.3",
  "transformers==5.20.2",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
diffusion = [
  "diffusers==0.41.0",
  "torch==2.14.0",
]
spaces = [
  "gradio==6.30.0",
]
test = [
  "httpx2==2.16.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[project.scripts]
superii-runtime = "superii_runtime.main:run"
superii-benchmark = "superii_runtime.benchmarks:main"
superii-bridge = "superii_runtime.bridge:main"
superii-policy = "superii_runtime.policy_service:main"

[project.urls]
Homepage = "https://www.superii.site"
Source = "https://github.com/smavgs/super-ii/tree/main/runtime"
Issues = "https://github.com/smavgs/super-ii/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/superii_runtime"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"space-image/launch_gradio.py" = ["S104"]
"space-image/space_proxy.py" = ["S104"]
"src/superii_runtime/api.py" = ["B008"]
"src/superii_runtime/runtimes/llama_cpp.py" = ["S603"]
"src/superii_runtime/runtimes/llama_server.py" = ["S603", "S607"]
"src/superii_runtime/runtimes/llama_tokenizer.py" = ["S603", "S607"]
"src/superii_runtime/scanners.py" = ["S603"]
"src/superii_runtime/security.py" = ["B008"]
"src/superii_runtime/settings.py" = ["S104"]
"src/superii_runtime/notebooks.py" = ["S103", "S603"]
"src/superii_runtime/spaces.py" = ["S108", "S603"]
"src/superii_runtime/storage.py" = ["S103"]
"src/superii_runtime/bridge.py" = ["S103", "S324"]
"tests/*" = ["S104"]
"tests/test_official_notebooks.py" = ["S102"]
