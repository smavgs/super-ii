[project]
name = "superii-notebook-executor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel==7.3.0",
  "nbclient==0.11.0",
  "nbformat==5.10.4",
]

[tool.uv]
constraint-dependencies = ["aiohttp>=3.14.4", "brotli>=1.2.1", "certifi>=2026.10.19", "filelock>=4.2.1", "multidict>=6.9.1", "opentelemetry-api>=1.45.2", "setuptools>=84.1.0", "tornado>=6.6.1", "pillow>=13.0.0"]
package = false
