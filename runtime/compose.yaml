name: superii-runtime

services:
  clamav:
    image: clamav/clamav-debian:1.5.4
    restart: unless-stopped
    volumes:
      - superii-data:/data:ro
      - clamav-signatures:/var/lib/clamav
    group_add:
      - "10001"
    networks:
      - runtime-private
      - runtime-egress
    ports:
      - 127.0.0.1:3310:3310
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: superii/runtime:0.1.0
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    environment:
      SUPERII_HOST: 0.0.0.0
      SUPERII_ALLOW_WILDCARD_BIND: "true"
      SUPERII_PORT: 8788
      SUPERII_STORAGE_ROOT: /data
      SUPERII_DATABASE_URL: ${SUPERII_DATABASE_URL:?set SUPERII_DATABASE_URL}
      SUPERII_RUNTIME_TOKEN: ${SUPERII_RUNTIME_TOKEN:?set SUPERII_RUNTIME_TOKEN}
      SUPERII_CLAMAV_COMMAND: clamdscan
      SUPERII_CLAMAV_CONFIG_FILE: /etc/clamav/clamd-client.conf
      SUPERII_GITLEAKS_COMMAND: gitleaks
      SUPERII_LLAMA_CLI_COMMAND: llama-cli
      SUPERII_LLAMA_SERVER_COMMAND: llama-server
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - superii-data:/data
      - ./clamd-client.conf:/etc/clamav/clamd-client.conf:ro
    ports:
      - 127.0.0.1:8788:8788
    networks:
      - runtime-private
      - runtime-egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  superii-data:
  clamav-signatures:

networks:
  runtime-private:
    internal: true
  runtime-egress:
