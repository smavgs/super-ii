[project]
name = "superii-project"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "superii-sdk[rag,serve]==0.3.0", "torch==2.14.0", "transformers==5.16.1",
  "accelerate==1.14.0", "faiss-cpu==1.15.0", "numpy==2.5.2",
  "fastapi==0.141.1", "uvicorn==0.52.4", "prometheus-client==0.26.0",
  "safetensors==0.8.0", "pytest==9.1.1"
]
[project.optional-dependencies]
train = ["superii-sdk[train]==0.3.0", "peft==0.20.0", "trl==1.12.0", "datasets==5.0.1"]
langchain = ["langchain-core==1.6.2"]
gradio = ["gradio==6.32.0"]
apple = ["mlx-lm==0.31.3; sys_platform == 'darwin'"]
observe = ["superii-sdk[observe]==0.3.0", "opentelemetry-sdk==1.45.2", "opentelemetry-exporter-otlp-proto-http==1.45.2"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# Published SDK 0.3.0 caps filelock below 4; source and recipe tests support 4.x.
override-dependencies = ["filelock>=4.2.1,<5"]
constraint-dependencies = ["aiohttp>=3.14.4", "brotli>=1.2.1", "certifi>=2026.10.19", "filelock>=4.2.1", "multidict>=6.9.1", "opentelemetry-api>=1.45.2", "setuptools>=84.1.0", "tornado>=6.6.1", "pillow>=13.0.0"]
