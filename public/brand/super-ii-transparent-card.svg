      <circle cx="48" cy="197" r="7" fill="#2367d1"/><text x="68" y="204">Declared</text><text x="350" y="204" text-anchor="end">06</text>
      <circle cx="48" cy="239" r="7" fill="#8a4cc8"/><text x="68" y="246">Derived</text><text x="350" y="246" text-anchor="end">04</text>
