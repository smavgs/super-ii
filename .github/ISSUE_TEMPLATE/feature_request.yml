name: Feature proposal
description: Propose a focused product, protocol, documentation, or developer-experience improvement.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, and what evidence shows the need?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without assuming a specific implementation.
    validations: { required: true }
  - type: textarea
    id: boundaries
    attributes:
      label: Trust, cost, and compatibility boundaries
      description: Note authentication, data, agent authority, infrastructure, migration, or cost implications.
    validations: { required: true }
