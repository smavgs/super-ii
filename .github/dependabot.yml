version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm-security-and-maintenance:
        patterns: ['*']
        # These packages sit on compatibility or deployment-size boundaries.
        # Keep their updates visible, but review them in individual PRs so one
        # incompatible major does not block the safe maintenance group.
        exclude-patterns:
          - '@huggingface/transformers'
          - '@modelcontextprotocol/client'
          - '@modelcontextprotocol/server'
          - agents
          - typescript
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      github-actions:
        patterns: ['*']
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /runtime
    schedule: { interval: weekly, day: monday }
    groups:
      runtime-python:
        patterns: ['*']
        # Review these large/compatibility-sensitive runtime packages alone.
        exclude-patterns:
          - huggingface-hub
          - torch
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /sdk/python
    schedule: { interval: weekly, day: monday }
    groups:
      sdk-python:
        patterns: ['*']
        # These upgrades can require SDK source changes and therefore should
        # not hold back unrelated safe dependency maintenance.
        exclude-patterns:
          - filelock
          - mcp
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /rust
    schedule: { interval: weekly, day: monday }
    groups:
      rust:
        patterns: ['*']
    open-pull-requests-limit: 3

  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      go:
        patterns: ['*']
    open-pull-requests-limit: 3
