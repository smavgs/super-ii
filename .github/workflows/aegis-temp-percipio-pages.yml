name: Aegis Percipio exact product pages
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-percipio-pages.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from PIL import Image
          out=pathlib.Path("percipio-pages");out.mkdir(exist_ok=True)
          T=[(104,"FM811-TIX"),(109,"FS820-E1"),(372,"PM805-E1"),(378,"PS801-E1"),(379,"PS801-N-E1"),(471,"TL430-E1"),(472,"TL460-S1-E1"),(473,"TM260-E1"),(476,"TM421-E1"),(477,"TM461-E2")]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          BAD=("logo","icon","favicon","banner","footer","header","qr","wechat","avatar","arrow","news","case","service","sdk")
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def slug(s):return re.sub(r"[^a-z0-9]+","-",s.lower()).strip("-")
          def good(b):
            try:
              im=Image.open(io.BytesIO(b));im.load();return len(b)>1800 and im.width>=150 and im.height>=100
            except:return False
          def ext(b,u):
            try:f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          rows=[]
          for idx,name in T:
            row={"index":idx,"name":name,"ok":False,"attempted":[]}
            n=norm(name);sname=slug(name)
            pages=[
              f"https://en.percipio.xyz/{sname}/",
              f"https://www.percipio.xyz/{sname}/",
              f"https://percipio.xyz/{sname}/",
            ]
            found=[]
            for page in pages:
              try:
                r=S.get(page,timeout=20,allow_redirects=True);row["attempted"].append({"url":page,"status":r.status_code,"final":r.url,"bytes":len(r.content)})
                if r.status_code!=200 or len(r.content)<5000:continue
                soup=BeautifulSoup(r.text,"html.parser");title=soup.title.get_text(" ",strip=True) if soup.title else ""
                body=soup.get_text(" ",strip=True)
                if n not in norm(title+" "+body):continue
                cand=[]
                for i,tag in enumerate(soup.find_all("img")):
                  vals=[]
                  for a in ("src","data-src","data-original","data-lazy-src"):
                    v=tag.get(a)
                    if v:vals.append(v)
                  ss=tag.get("srcset")
                  if ss:vals += [x.strip().split()[0] for x in ss.split(",") if x.strip()]
                  lab=(tag.get("alt") or "")+" "+(tag.get("title") or "")
                  for v in vals:
                    u=urljoin(r.url,v);lu=u.lower()
                    if any(x in lu for x in BAD):continue
                    score=0
                    if n in norm(lab):score=10000
                    elif n in norm(u):score=9000
                    elif "product" in lu or "camera" in lu or "upload" in lu:score=2000-i*5
                    cand.append((score,u,lab,i))
                for tag in soup.find_all("meta"):
                  k=(tag.get("property") or tag.get("name") or "").lower()
                  if k in ("og:image","og:image:url","twitter:image") and tag.get("content"):
                    cand.append((4000,urljoin(r.url,tag["content"]),"meta",-1))
                best=None
                for score,u,lab,i in sorted(cand,reverse=True)[:30]:
                  if score<1500:continue
                  try:
                    ir=S.get(u,headers={"Referer":r.url},timeout=15);ir.raise_for_status();b=ir.content
                    if not good(b):continue
                    im=Image.open(io.BytesIO(b));w,h=im.size
                    if max(w/h,h/w)>5:continue
                    s2=score*10000000+w*h+len(b)
                    if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,lab,i,score,r.url)
                  except:pass
                if best:found.append(best)
              except Exception as e:row["attempted"].append({"url":page,"error":f"{type(e).__name__}:{e}"})
            if found:
              best=max(found,key=lambda x:x[0]);_,b,u,w,h,lab,i,score,page=best
              fn=f"{idx:03d} - Percipio - {name}{ext(b,u)}";(out/fn).write_bytes(b)
              row.update({"ok":True,"file":fn,"page":page,"source":u,"dimensions":[w,h],"label":lab,"dom_index":i,"score":score})
            else:row["error"]="no exact official page image"
            rows.append(row);print(json.dumps(row,ensure_ascii=False),flush=True)
          (out/"_report.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-percipio-pages
          path: percipio-pages/
          retention-days: 1
