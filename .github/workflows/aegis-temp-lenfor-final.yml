name: Aegis LENFOR exact API originals
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-lenfor-final.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: python -m pip install --quiet requests==2.32.5 pillow==12.0.0
      - name: Recover exact LENFOR product images from public API
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests
          from urllib.parse import urljoin,urlparse
          from PIL import Image
          items={
            199:"LF-LEAGF46-65-15-SR-DD",200:"LF-LEGF-140-1000-SR-BD",201:"LF-MEA12-10-30-RCA-DD",
            202:"LF-MEA15-08-400-RAA-DD-T",203:"LF-MEA25-08-400-RAA-DD",204:"LF-MEAF30-15-150-RBC-DD",
            205:"LF-MEGF18-15-003-SR-DD",206:"LF-MERG34-15-35-RR",207:"LF-MFGF29-26-100-SR-DD",
            208:"LF-MSEC35-100-50-DR-DB",209:"LF-RH1X-1L"
          }
          API="https://api.lenfortech.com/api/products?with_details=true"
          out=pathlib.Path("lenfor-final");out.mkdir(exist_ok=True)
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0","Accept":"application/json,image/*,*/*;q=0.8"})
          r=S.get(API,timeout=30);r.raise_for_status();data=r.json()
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def clean(s):return re.sub(r'[\\/:*?"<>|]+','-',s).strip()
          def find_objects(x,mn,res):
            if isinstance(x,dict):
              flat=" ".join(str(v) for v in x.values() if not isinstance(v,(dict,list)))
              if mn in norm(flat):res.append(x)
              for v in x.values():find_objects(v,mn,res)
            elif isinstance(x,list):
              for v in x:find_objects(v,mn,res)
          def collect_urls(x,res,keyhint=""):
            if isinstance(x,dict):
              for k,v in x.items():
                kh=str(k).lower()
                if isinstance(v,str):
                  if (any(t in kh for t in ("image","photo","picture","thumbnail","media","url")) or re.search(r'\.(?:png|jpe?g|webp)(?:\?|$)',v,re.I)) and (v.startswith("http") or v.startswith("/")):
                    res.append(v)
                elif isinstance(v,(dict,list)):collect_urls(v,res,kh)
            elif isinstance(x,list):
              for v in x:collect_urls(v,res,keyhint)
          def valid(b):
            try:
              im=Image.open(io.BytesIO(b));im.load()
              return im.width>=120 and im.height>=100
            except:return False
          results=[]
          for idx,model in items.items():
            objs=[];find_objects(data,norm(model),objs)
            urls=[]
            for o in objs[:20]:collect_urls(o,urls)
            # de-dup and try exact model object's images first
            seen=set();cands=[]
            for u in urls:
              if u in seen:continue
              seen.add(u);cands.append(urljoin(API,u))
            chosen=None
            for u in cands[:30]:
              try:
                ir=S.get(u,headers={"Referer":"https://lenfortech.com/"},timeout=20);ir.raise_for_status();b=ir.content
                if not valid(b):continue
                im=Image.open(io.BytesIO(b))
                chosen=(b,ir.url,[im.width,im.height])
                break
              except:pass
            if not chosen:
              row={"index":idx,"name":model,"ok":False,"objects":len(objs),"candidate_urls":cands[:10]}
              results.append(row);print(json.dumps(row),flush=True);continue
            b,u,dims=chosen
            fmt=Image.open(io.BytesIO(b)).format.lower();ext=".jpg" if fmt=="jpeg" else "."+fmt
            fn=f"{idx:03d} - LENFOR - {clean(model)}{ext}"
            (out/fn).write_bytes(b)
            row={"index":idx,"name":model,"ok":True,"file":fn,"source":u,"dimensions":dims,"objects":len(objs)}
            results.append(row);print(json.dumps(row),flush=True)
          (out/"_report.json").write_text(json.dumps(results,indent=2))
          print("SUMMARY",sum(bool(x.get("ok")) for x in results),len(results))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-lenfor-final
          path: lenfor-final/
          retention-days: 1
