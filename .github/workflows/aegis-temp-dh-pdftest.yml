name: Aegis DH direct PDF test
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-dh-pdftest.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests==2.32.5
      - shell: bash
        run: |
          python3 - <<'PY'
          import requests,json
          urls=[
            "https://www.dh-robotics.com/wp-content/uploads/2022/01/PGC-Series.pdf",
            "https://www.dh-robotics.com/wp-content/uploads/2022/01/PGE-Series.pdf",
            "https://www.dh-robotics.com/wp-content/uploads/2022/03/Servo-Electric-Gripper_DH-Robotics_EN.23.01.pdf",
            "https://www.dh-robotics.com/wp-content/uploads/2023/08/PGSE-Series_DH-Robotics_EN2307.pdf",
            "https://www.dh-robotics.com/wp-content/uploads/2024/07/DH_Electric-Gripper-Brochure.pdf"
          ]
          rows=[]
          for u in urls:
            try:
              r=requests.get(u,headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.dh-robotics.com/"},timeout=30,allow_redirects=True)
              rows.append({"url":u,"status":r.status_code,"bytes":len(r.content),"ct":r.headers.get("content-type"),"final":r.url,"pdf":r.content[:4]==b"%PDF"})
            except Exception as e:rows.append({"url":u,"error":repr(e)})
          print(json.dumps(rows,indent=2))
          PY
