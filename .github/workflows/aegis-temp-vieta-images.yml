name: Aegis Vieta exact page images
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-vieta-images.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests,urllib3
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from PIL import Image
          urllib3.disable_warnings()
          out=pathlib.Path("vieta-images");out.mkdir(exist_ok=True)
          T=[
            (135,"GSE-20","https://www.vieta-tech.com/list_6/76.html"),
            (136,"GSRE-6","https://www.vieta-tech.com/list_6/31.html"),
            (137,"GTE-25","https://www.vieta-tech.com/list_6/24.html"),
            (138,"GTRE-12","https://www.vieta-tech.com/list_6/74.html"),
            (339,"MTHE4-100","https://www.vieta-tech.com/list_21/82.html"),
            (494,"VZRE-5-100","https://www.vieta-tech.com/list_20/27.html"),
          ]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          BAD=("logo","icon","favicon","banner","footer","header","qr","wechat","map","news","case","service")
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def good(b):
            try:
              im=Image.open(io.BytesIO(b));im.load();return len(b)>2000 and im.width>=160 and im.height>=100
            except:return False
          def ext(b,u):
            try:f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          rows=[]
          for idx,name,page in T:
            row={"index":idx,"name":name,"page":page,"ok":False}
            try:
              r=S.get(page,timeout=25,verify=False);r.raise_for_status()
              s=BeautifulSoup(r.text,"html.parser")
              title=s.title.get_text(" ",strip=True) if s.title else ""
              if norm(name) not in norm(title+" "+s.get_text(" ",strip=True)[:5000]):raise ValueError("model-not-on-page")
              cand=[]
              for i,tag in enumerate(s.find_all("img")):
                src=tag.get("src") or tag.get("data-src") or tag.get("data-original")
                if not src:continue
                u=urljoin(r.url,src);lu=u.lower();lab=(tag.get("alt") or "")+" "+(tag.get("title") or "")
                if any(x in lu for x in BAD):continue
                score=0
                if norm(name) in norm(lab):score=8000
                elif norm(name) in norm(u):score=7000
                elif i<12:score=3000-i*100
                if any(x in lu for x in ("product","upload","uploads","static")):score+=500
                cand.append((score,u,lab,i))
              best=None
              for score,u,lab,i in sorted(cand,reverse=True)[:25]:
                if score<1000:continue
                try:
                  ir=S.get(u,headers={"Referer":r.url},timeout=15,verify=False);ir.raise_for_status();b=ir.content
                  if not good(b):continue
                  im=Image.open(io.BytesIO(b));w,h=im.size
                  if max(w/h,h/w)>5:continue
                  s2=score*10000000+w*h+len(b)
                  if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,lab,i,score)
                except:pass
              if not best:raise ValueError(f"no-valid-image candidates={len(cand)}")
              _,b,u,w,h,lab,i,score=best
              fn=f"{idx:03d} - Vieta - {name}{ext(b,u)}";(out/fn).write_bytes(b)
              row.update({"ok":True,"file":fn,"source":u,"dimensions":[w,h],"label":lab,"dom_index":i,"score":score})
            except Exception as e:row["error"]=f"{type(e).__name__}:{e}"
            rows.append(row);print(json.dumps(row,ensure_ascii=False))
          (out/"_report.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-vieta-images
          path: vieta-images/
          retention-days: 1
