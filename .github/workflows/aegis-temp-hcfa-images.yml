name: Aegis temporary HCFA component images
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-hcfa-images.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - name: Recover HCFA exact product images
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests,warnings
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from PIL import Image
          warnings.filterwarnings("ignore")
          root=pathlib.Path(".");out=root/"hcfa-images";out.mkdir(exist_ok=True)
          entries=[x for x in json.loads((root/".aegis-temp/component-images-missing-4.json").read_text())["missing"] if x.get("manufacturer")=="HCFA"]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 Chrome/155 Safari/537.36","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          def clean(s):return re.sub(r'[\\/:*?"<>|]+','-',str(s or '')).strip()
          def get(u,ref=None):
            h={"Referer":ref} if ref else {}
            try:r=S.get(u,headers=h,timeout=12,allow_redirects=True);r.raise_for_status();return r
            except requests.exceptions.SSLError:r=S.get(u,headers=h,timeout=12,allow_redirects=True,verify=False);r.raise_for_status();return r
          def valid(b):
            if len(b)<1200:return None
            try:
              im=Image.open(io.BytesIO(b));im.load()
              if im.width<100 or im.height<100:return None
              return im.width,im.height,im.format
            except:return None
          results=[]
          for it in entries:
            idx,rid,name=it["index"],it["id"],it["name"]
            rec=json.loads((root/"public/robot-library/records"/f"{rid}.json").read_text())
            page=rec.get("website") or next((x.get("url") for x in rec.get("resources") or [] if isinstance(x,dict) and x.get("url")),"")
            try:r=get(page)
            except Exception as e:
              results.append({"index":idx,"name":name,"ok":False,"error":f"page:{e}"});continue
            soup=BeautifulSoup(r.text,"html.parser")
            # Find the title node and then images in document order after it.
            title_node=None
            for tag in soup.find_all(["h1","h2","h3","div","p","span"]):
              txt=tag.get_text(" ",strip=True)
              if name.lower() in txt.lower() or (len(name)>=2 and name.lower().replace("-","") in txt.lower().replace("-","")):
                title_node=tag;break
            candidates=[]
            start=False if title_node else True
            for tag in soup.find_all(True):
              if tag is title_node:start=True
              if not start or tag.name!="img":continue
              vals=[]
              for a in ("src","data-src","data-original","data-lazy-src"):
                v=tag.get(a)
                if isinstance(v,str) and v.strip():vals.append(v.strip())
              ss=tag.get("srcset")
              if isinstance(ss,str):vals += [q.strip().split()[0] for q in ss.split(",") if q.strip()]
              for v in vals:
                u=urljoin(r.url,v)
                ul=u.lower()
                if any(x in ul for x in ("logo","icon","qrcode","wechat","footer","header","banner")):continue
                if "/upload/img/" not in ul and "/uploads/" not in ul:continue
                candidates.append(u)
            # Fallback: all HCFA upload images, preserving order.
            if not candidates:
              for tag in soup.find_all("img"):
                v=tag.get("src") or tag.get("data-src") or tag.get("data-original")
                if not v:continue
                u=urljoin(r.url,v);ul=u.lower()
                if "/upload/img/" in ul and not any(x in ul for x in ("logo","icon","qrcode","wechat","banner")):candidates.append(u)
            seen=set();chosen=None
            for u in candidates:
              if u in seen:continue
              seen.add(u)
              try:
                ir=get(u,r.url);vv=valid(ir.content)
                if not vv:continue
                w,h,fmt=vv
                # Prefer isolated product shots; title-following order is primary.
                if max(w/h,h/w)>8:continue
                chosen=(ir,w,h,fmt);break
              except:pass
            if not chosen:
              results.append({"index":idx,"name":name,"ok":False,"error":"no-product-image","page":page});continue
            ir,w,h,fmt=chosen
            ext=".jpg" if (fmt or "").lower()=="jpeg" else "."+(fmt or "png").lower()
            fn=f"{idx:03d} - HCFA - {clean(name)}{ext}"
            (out/fn).write_bytes(ir.content)
            results.append({"index":idx,"name":name,"ok":True,"file":fn,"source":ir.url,"page":page,"dimensions":[w,h],"evidence":"first-official-image-after-title"})
          ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":len(entries),"success":ok,"failed":len(entries)-ok,"results":results},ensure_ascii=False,indent=2))
          print(json.dumps({"requested":len(entries),"success":ok,"failed":len(entries)-ok}))
          for x in results:print(json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-hcfa-images
          path: hcfa-images/
          if-no-files-found: error
          retention-days: 1
