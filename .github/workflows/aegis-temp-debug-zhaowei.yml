name: Aegis debug ZHAOWEI product gallery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-debug-zhaowei.yml"
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet beautifulsoup4==4.14.2 requests==2.32.5
      - name: Inspect exact ZHAOWEI product page
        shell: bash
        run: |
          python3 - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          u="https://www.zwgear.com/products/6mmwskxbdj.html"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=20)
          print("STATUS",r.status_code,r.url,r.headers.get("content-type"),len(r.content))
          s=BeautifulSoup(r.text,"html.parser")
          print("TITLE",s.title.get_text(" ",strip=True) if s.title else "")
          imgs=s.find_all("img")
          print("IMGS",len(imgs))
          for i,tag in enumerate(imgs[:120]):
            src=tag.get("src") or tag.get("data-src") or tag.get("data-original")
            if src:
              print("IMG",i,{"src":src,"alt":tag.get("alt"),"title":tag.get("title"),"class":tag.get("class")})
          for i,tag in enumerate(s.find_all("meta")):
            key=(tag.get("property") or tag.get("name") or "").lower()
            if "image" in key: print("META",key,tag.get("content"))
          for needle in ["mc0623","6mm无刷空心杯电机"]:
            p=r.text.lower().find(needle.lower())
            print("NEEDLE",needle,"POS",p)
            if p>=0: print(r.text[max(0,p-2500):p+5000])
          PY
