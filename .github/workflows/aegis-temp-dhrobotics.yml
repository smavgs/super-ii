name: Aegis DH-Robotics exact recovery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-dhrobotics.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - name: Recover DH-Robotics official product images
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,io,json,pathlib,re
          from urllib.parse import urljoin,urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          out=pathlib.Path("dhrobotics-exact");out.mkdir(exist_ok=True)
          targets=[
            (362,"PGC-140-50","https://en.dh-robotics.com/product/pgc"),
            (363,"PGE-5-26","https://en.dh-robotics.com/product/pge"),
            (364,"PGEA-100-26","https://en.dh-robotics.com/product/pgea"),
            (365,"PGHL-400-80","https://en.dh-robotics.com/product/pghl"),
            (367,"PGSE-15-7","https://en.dh-robotics.com/product/pgse"),
          ]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          BAD=("logo","icon","favicon","banner","header","footer","wechat","qr","avatar","arrow","map","contact","application","case","download","plugin")
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def valid(b):
            try:
              im=Image.open(io.BytesIO(b));im.load()
              return len(b)>3000 and im.width>=200 and im.height>=140
            except:return False
          def ext(b,u):
            try:
              f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          def all_urls(tag,base):
            a=[]
            for k in ("src","data-src","data-original","data-lazy-src"):
              v=tag.get(k)
              if isinstance(v,str) and v.strip():a.append(urljoin(base,v))
            ss=tag.get("srcset")
            if isinstance(ss,str):a += [urljoin(base,x.strip().split()[0]) for x in ss.split(",") if x.strip()]
            return a
          def one(t):
            idx,name,page=t;n=norm(name)
            try:r=S.get(page,timeout=25);r.raise_for_status()
            except Exception as e:return {"index":idx,"name":name,"ok":False,"error":f"page:{type(e).__name__}:{e}"}
            soup=BeautifulSoup(r.text,"html.parser");txt=soup.get_text(" ",strip=True)
            if n not in norm(txt):return {"index":idx,"name":name,"ok":False,"error":"model absent from official family page"}
            cand=[]
            # Exact image labels/URLs first.
            for tag in soup.find_all("img"):
              lab=(tag.get("alt") or "")+" "+(tag.get("title") or "")
              for u in all_urls(tag,r.url):
                lu=u.lower()
                if any(x in lu for x in BAD):continue
                score=0
                if n in norm(lab):score=5000
                elif n in norm(u):score=4500
                elif "product" in lu or "upload" in lu:score=500
                if score:cand.append((score,u,lab))
            # Find model table cell and nearby page block.
            for s in soup.find_all(string=True):
              if n and n in norm(s):
                p=s.parent
                for depth in range(7):
                  if not p:break
                  imgs=[]
                  for tag in p.find_all("img",limit=20):
                    imgs+=all_urls(tag,r.url)
                  for u in imgs:
                    if any(x in u.lower() for x in BAD):continue
                    cand.append((3500-depth*250,u,"near-model-block"))
                  if imgs:break
                  p=p.parent
            # Family page hero / OG as fallback, because page is dedicated to the product family containing the exact model.
            for tag in soup.find_all("meta"):
              k=(tag.get("property") or tag.get("name") or "").lower()
              if k in ("og:image","og:image:url","twitter:image") and tag.get("content"):
                cand.append((1600,urljoin(r.url,tag["content"]),"family-og"))
            # Images in first half of page, strongly product-looking.
            imgs=soup.find_all("img")
            for i,tag in enumerate(imgs[:max(10,len(imgs)//2)]):
              for u in all_urls(tag,r.url):
                lu=u.lower()
                if any(x in lu for x in BAD):continue
                if any(x in lu for x in ("product","prod","gripper","pge","pgc","pghl","pgse")):
                  cand.append((1200-i*5,u,"family-product-image"))
            uniq={}
            for s,u,w in cand:
              if u not in uniq or s>uniq[u][0]:uniq[u]=(s,w)
            best=None
            for score,u,why in sorted(((s,u,w) for u,(s,w) in uniq.items()),reverse=True)[:30]:
              if score<1000:continue
              try:
                ir=S.get(u,headers={"Referer":r.url},timeout=15);ir.raise_for_status();b=ir.content
                if not valid(b):continue
                im=Image.open(io.BytesIO(b));w,h=im.size
                ratio=max(w/h,h/w)
                if ratio>4:continue
                s2=score*10000000+w*h+min(len(b),1000000)
                if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,why,score)
              except:pass
            if not best:return {"index":idx,"name":name,"ok":False,"error":f"no valid product image ({len(uniq)} candidates)"}
            _,b,u,w,h,why,score=best
            fn=f"{idx:03d} - DH-Robotics - {name}{ext(b,u)}";(out/fn).write_bytes(b)
            return {"index":idx,"name":name,"ok":True,"file":fn,"page":r.url,"source":u,"dimensions":[w,h],"evidence":why,"score":score}
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
            for f in concurrent.futures.as_completed([ex.submit(one,t) for t in targets]):
              try:x=f.result()
              except Exception as e:x={"ok":False,"error":str(e)}
              results.append(x);print(json.dumps(x,ensure_ascii=False),flush=True)
          results.sort(key=lambda x:x.get("index",9999));ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":len(targets),"success":ok,"failed":len(targets)-ok,"results":results},ensure_ascii=False,indent=2))
          print(f"SUMMARY success={ok} failed={len(targets)-ok}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-dhrobotics-exact
          path: dhrobotics-exact/
          retention-days: 1
