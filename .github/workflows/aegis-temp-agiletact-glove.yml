name: Aegis AgileTact glove exact image
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-agiletact-glove.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from PIL import Image
          out=pathlib.Path("agiletact-glove");out.mkdir(exist_ok=True)
          page="https://www.agiletact.com/products?ut_language=en-US"
          r=requests.get(page,headers={"User-Agent":"Mozilla/5.0"},timeout=25);r.raise_for_status()
          s=BeautifulSoup(r.text,"html.parser");n="datacapturegloves";cand=[]
          for st in s.find_all(string=True):
            if n in re.sub(r"[^a-z0-9]+","",str(st).lower()):
              p=st.parent
              for depth in range(7):
                if not p:break
                for tag in p.find_all("img",limit=15):
                  src=tag.get("src") or tag.get("data-src") or tag.get("data-original")
                  if src:cand.append((5000-depth*300,urljoin(r.url,src),tag.get("alt") or ""))
                if cand:break
                p=p.parent
          for tag in s.find_all("img"):
            lab=(tag.get("alt") or "")+" "+(tag.get("title") or "")
            src=tag.get("src") or tag.get("data-src")
            if src and ("glove" in lab.lower() or "glove" in src.lower()):cand.append((7000,urljoin(r.url,src),lab))
          best=None
          for score,u,lab in sorted(cand,reverse=True):
            try:
              ir=requests.get(u,headers={"User-Agent":"Mozilla/5.0","Referer":r.url},timeout=20);ir.raise_for_status();b=ir.content
              im=Image.open(io.BytesIO(b));im.load();w,h=im.size
              if len(b)<2000 or w<160 or h<100:continue
              s2=score*10000000+w*h+len(b)
              if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,lab)
            except:pass
          row={"index":59,"name":"Data Capture Gloves","ok":False}
          if best:
            _,b,u,w,h,lab=best
            ext="."+Image.open(io.BytesIO(b)).format.lower().replace("jpeg","jpg")
            fn="059 - AgileTact - Data Capture Gloves"+ext;(out/fn).write_bytes(b)
            row.update({"ok":True,"file":fn,"source":u,"dimensions":[w,h],"label":lab})
          else:row["error"]=f"no image candidates ({len(cand)})"
          (out/"_report.json").write_text(json.dumps(row,ensure_ascii=False,indent=2));print(json.dumps(row,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-agiletact-glove
          path: agiletact-glove/
          retention-days: 1
