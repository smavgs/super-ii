name: Aegis HCFA Hu-MLS candidate audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-hcfa-mls.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet requests==2.32.5 pillow==12.0.0
      - name: Download Hu-MLS exact-page candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,requests
          from PIL import Image
          urls=[
            "https://www.hcfa.cn/upload/img/2025-12/69533110bee57.png",
            "https://www.hcfa.cn/upload/img/2025-12/69533107593fe.png",
            "https://www.hcfa.cn/upload/img/2026-03/69a500c58dc93.png",
            "https://www.hcfa.cn/upload/img/2025-12/695330eea8d95.png",
            "https://www.hcfa.cn/upload/img/2025-12/695330d44aeae.png",
            "https://www.hcfa.cn/upload/img/2025-12/695330bf673c9.png",
            "https://www.hcfa.cn/upload/img/2025-12/695330aad5703.png",
            "https://www.hcfa.cn/upload/img/2025-12/6953308e817bc.png",
            "https://www.hcfa.cn/upload/img/2025-12/6954b52d53760.png",
            "https://www.hcfa.cn/upload/img/2025-12/695330652b618.png"
          ]
          out=pathlib.Path("hcfa-mls");out.mkdir(exist_ok=True)
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0"})
          rows=[]
          for i,u in enumerate(urls,1):
            try:
              r=S.get(u,headers={"Referer":"https://www.hcfa.cn/product/detail/id/158.html"},timeout=20);r.raise_for_status()
              b=r.content;im=Image.open(io.BytesIO(b));im.load()
              ext=".jpg" if im.format.lower()=="jpeg" else "."+im.format.lower()
              fn=f"{i:02d}{ext}";(out/fn).write_bytes(b)
              rows.append({"n":i,"ok":True,"file":fn,"url":u,"dimensions":[im.width,im.height],"bytes":len(b)})
            except Exception as e:rows.append({"n":i,"ok":False,"url":u,"error":str(e)})
          (out/"_report.json").write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-hcfa-mls
          path: hcfa-mls/
          retention-days: 1
