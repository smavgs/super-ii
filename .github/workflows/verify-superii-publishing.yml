name: Verify GitHub to Super ii publication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-private-fixture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: superii-production-verification
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.24
      - run: uv sync --directory sdk/python --frozen
      - run: sdk/python/.venv/bin/python tools/verify_superii_publishing.py
        env:
          SUPERII_VERIFY_REPOSITORY_ID: ${{ vars.SUPERII_VERIFY_REPOSITORY_ID }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-superii-publishing
          path: reports/github-superii-publishing.json
          retention-days: 7

  verify-generated-projects:
    needs: verify-private-fixture
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: superii-production-verification
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.24
      - name: Install the published SDK from the project lock
        run: |
          mkdir "$RUNNER_TEMP/superii-project-environment"
          cp src/data/recipes/project.toml "$RUNNER_TEMP/superii-project-environment/pyproject.toml"
          cp src/data/recipes/uv.lock "$RUNNER_TEMP/superii-project-environment/uv.lock"
          uv sync --project "$RUNNER_TEMP/superii-project-environment" --frozen --extra train
      - name: Execute generated projects and publish a private adapter
        run: '"$RUNNER_TEMP/superii-project-environment/.venv/bin/python" tools/verify_superii_projects.py'
        env:
          SUPERII_PROJECT_FIXTURES: ${{ vars.SUPERII_PROJECT_FIXTURES }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-projects
          path: reports/generated-projects.json
          retention-days: 7
