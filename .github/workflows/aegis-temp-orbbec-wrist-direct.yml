name: Aegis Orbbec Wrist direct asset
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-orbbec-wrist-direct.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests==2.32.5 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,requests
          from PIL import Image
          out=pathlib.Path("orbbec-wrist-direct");out.mkdir(exist_ok=True)
          u="https://new-orbbec3d-s3.s3.amazonaws.com/wp-content/uploads/2026/10/22085130/Wrist-1.webp"
          row={"index":495,"name":"WristCam","ok":False,"source":u}
          try:
            r=requests.get(u,headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.orbbec.com/robot-free-data-collection/"},timeout=25);r.raise_for_status()
            b=r.content;im=Image.open(io.BytesIO(b));im.load()
            fn="495 - Orbbec - WristCam.webp";(out/fn).write_bytes(b)
            row.update({"ok":True,"file":fn,"dimensions":[im.width,im.height],"bytes":len(b)})
          except Exception as e:row["error"]=repr(e)
          (out/"_report.json").write_text(json.dumps(row,indent=2));print(json.dumps(row,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-orbbec-wrist-direct
          path: orbbec-wrist-direct/
          retention-days: 1
