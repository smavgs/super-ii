name: Aegis ZHAOWEI exact product originals
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-zhaowei-final.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests==2.32.5 pillow==12.0.0
      - name: Download exact first product images from official ZHAOWEI pages
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,requests
          from PIL import Image
          items={
            301:("MC0623","https://www.zwgear.com/products/6mmwskxbdj.html","https://www.zwgear.com/wp-content/uploads/2024/03/2024-03-21-01150268.jpg"),
            302:("MC0818","https://www.zwgear.com/products/micromotor/blesshcmotor/%CE%A6-8mm-%E6%97%A0%E5%88%B7%E7%A9%BA%E5%BF%83%E6%9D%AF%E7%94%B5%E6%9C%BA.html","https://www.zwgear.com/wp-content/uploads/2026/05/2026-06-03-09383141.png"),
            304:("MC0824","https://www.zwgear.com/products/8mmwskxbdj.html","https://www.zwgear.com/wp-content/uploads/2024/03/2025-07-25-05522051.jpg"),
            306:("MC1028","https://www.zwgear.com/products/10mmwskxbdj.html","https://www.zwgear.com/wp-content/uploads/2024/03/2025-07-25-06022011.jpg"),
            307:("MC1214","https://www.zwgear.com/products/micromotor/blesshcmotor/%CE%A6-12mm-%E6%97%A0%E5%88%B7%E7%A9%BA%E5%BF%83%E6%9D%AF%E7%94%B5%E6%9C%BAmc1214.html","https://www.zwgear.com/wp-content/uploads/2026/05/2026-06-03-09475889.png"),
            308:("MC1223","https://www.zwgear.com/products/micromotor/blesshcmotor/%CE%A612mmwskxbdjmc1223.html","https://www.zwgear.com/wp-content/uploads/2025/07/2025-07-25-06215599.jpg"),
            309:("MC1226","https://www.zwgear.com/products/12mmwskxbdj.html","https://www.zwgear.com/wp-content/uploads/2024/03/2025-07-25-06111683.jpg"),
            310:("MC1237","https://www.zwgear.com/products/micromotor/blesshcmotor/%CE%A612mmwskxbdjmc1237.html","https://www.zwgear.com/wp-content/uploads/2025/07/2025-07-25-06410478.jpg"),
            311:("MC1625","https://www.zwgear.com/products/micromotor/blesshcmotor/%CE%A616mm-wskxbdjsjcjmc1625.html","https://www.zwgear.com/wp-content/uploads/2025/07/2025-07-25-07044010.jpg"),
            314:("MC2232","https://www.zwgear.com/products/micromotor/blesshcmotor/%CE%A622mmwskxbdjmc2232.html","https://www.zwgear.com/wp-content/uploads/2025/07/2025-07-25-07322612.jpg"),
            315:("MC2250","https://www.zwgear.com/products/%CE%A622mmwskxbdjmc2250.html","https://www.zwgear.com/wp-content/uploads/2025/07/2025-07-25-07430557.png"),
            316:("MC2643","https://www.zwgear.com/uncategorized/%CE%A6-26mm-%E6%97%A0%E5%88%B7%E7%A9%BA%E5%BF%83%E6%9D%AF%E7%94%B5%E6%9C%BAmc2643.html","https://www.zwgear.com/wp-content/uploads/2026/06/2026-06-03-09501110.png"),
            516:("ZWSMD008008","https://www.zwgear.com/products/8mmxxclx.html","https://www.zwgear.com/wp-content/uploads/2024/03/2024-03-13-10170398.jpg"),
          }
          out=pathlib.Path("zhaowei-exact");out.mkdir(exist_ok=True)
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"image/avif,image/webp,image/*,*/*;q=0.8"})
          results=[]
          for idx,(model,page,img) in items.items():
            try:
              r=S.get(img,headers={"Referer":page},timeout=25);r.raise_for_status()
              b=r.content; im=Image.open(io.BytesIO(b));im.load()
              if im.width<180 or im.height<140: raise ValueError("image too small")
              ext=".jpg" if im.format.lower()=="jpeg" else "."+im.format.lower()
              fn=f"{idx:03d} - ZHAOWEI - {model}{ext}"
              (out/fn).write_bytes(b)
              row={"index":idx,"model":model,"ok":True,"file":fn,"source":r.url,"page":page,"dimensions":[im.width,im.height],"bytes":len(b)}
            except Exception as e:
              row={"index":idx,"model":model,"ok":False,"page":page,"source":img,"error":str(e)}
            results.append(row);print(json.dumps(row,ensure_ascii=False),flush=True)
          (out/"_report.json").write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print("SUMMARY",sum(1 for x in results if x.get("ok")),len(results))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-zhaowei-final
          path: zhaowei-exact/
          retention-days: 1
