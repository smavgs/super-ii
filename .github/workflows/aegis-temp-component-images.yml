name: Aegis temporary component image recovery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-component-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exact preserved source images
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, pathlib, re, time, urllib.request, urllib.error
          from urllib.parse import urlparse

          root = pathlib.Path(".")
          out = root / "component-images"
          out.mkdir(exist_ok=True)
          manifest = json.loads((root / ".aegis-temp/component-images-missing.json").read_text())
          entries = manifest["missing"]

          aliases = {
              "Jiangsu DINGS' Intelligent Control Technology Co., Ltd.": "DINGS",
              "DH-Robotics Technology Co., Ltd.": "DH-Robotics",
              "Nanchang Kude Intelligent Technology Co., Ltd.": "CubeMars",
              "Mech-Mind Robotics": "Mech-Mind",
          }

          def clean(s):
              s = re.sub(r'[\\/:*?"<>|]+', '-', str(s or '')).strip()
              s = re.sub(r'\s+', ' ', s)
              return s[:100].strip(' .-') or "Unknown"

          def ext_for(url, ctype, data):
              p = pathlib.Path(urlparse(url).path).suffix.lower()
              if p in {".jpg",".jpeg",".png",".webp",".gif",".svg"}: return p
              c = (ctype or "").lower()
              if "jpeg" in c: return ".jpg"
              if "png" in c: return ".png"
              if "webp" in c: return ".webp"
              if "gif" in c: return ".gif"
              if "svg" in c: return ".svg"
              if data.startswith(b"\xff\xd8\xff"): return ".jpg"
              if data.startswith(b"\x89PNG\r\n\x1a\n"): return ".png"
              if len(data) >= 12 and data[:4] == b"RIFF" and data[8:12] == b"WEBP": return ".webp"
              if data.startswith((b"GIF87a", b"GIF89a")): return ".gif"
              return ""

          def valid(data, ctype):
              if not data or len(data) < 64: return False
              if data.startswith(b"\xff\xd8\xff"): return True
              if data.startswith(b"\x89PNG\r\n\x1a\n"): return True
              if len(data) >= 12 and data[:4] == b"RIFF" and data[8:12] == b"WEBP": return True
              if data.startswith((b"GIF87a", b"GIF89a")): return True
              head = data[:512].lstrip().lower()
              if b"<svg" in head and ("image/svg" in (ctype or "").lower()): return True
              return False

          def one(item):
              idx, rid = item["index"], item["id"]
              rp = root / "public/robot-library/records" / f"{rid}.json"
              try:
                  rec = json.loads(rp.read_text())
              except Exception as e:
                  return {"index":idx,"id":rid,"ok":False,"error":f"record:{e}"}
              urls = rec.get("source_images") or []
              if not urls:
                  return {"index":idx,"id":rid,"name":rec.get("name"),"ok":False,"error":"no source_images"}
              url = urls[0]
              maker = ((rec.get("makers") or [{}])[0].get("name") or "Unknown")
              maker = aliases.get(maker, maker)
              family = ((rec.get("family") or {}).get("name") or "")
              name = rec.get("name") or rid
              parts = [f"{idx:03d}", clean(maker)]
              if family and clean(family).lower() != clean(name).lower():
                  parts.append(clean(family))
              parts.append(clean(name))
              stem = " - ".join(parts)
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={
                          "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
                          "Accept":"image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
                          "Referer":"https://www.robots.com/",
                      })
                      with urllib.request.urlopen(req, timeout=25) as resp:
                          data = resp.read()
                          ctype = resp.headers.get("Content-Type","")
                      if not valid(data, ctype):
                          raise ValueError(f"not-image ctype={ctype} bytes={len(data)}")
                      ext = ext_for(url, ctype, data)
                      if not ext:
                          raise ValueError(f"unknown-image ctype={ctype}")
                      fn = stem + ext
                      (out / fn).write_bytes(data)
                      return {"index":idx,"id":rid,"name":name,"ok":True,"file":fn,"bytes":len(data),"source":url}
                  except Exception as e:
                      last = str(e)
                      time.sleep(1.0 + attempt)
              return {"index":idx,"id":rid,"name":name,"ok":False,"error":last,"source":url}

          results = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              futures = [ex.submit(one, x) for x in entries]
              for n, f in enumerate(concurrent.futures.as_completed(futures), 1):
                  r = f.result()
                  results.append(r)
                  print(json.dumps(r, ensure_ascii=False), flush=True)
                  if n % 25 == 0:
                      print(f"PROGRESS {n}/{len(entries)}", flush=True)

          results.sort(key=lambda x:x["index"])
          ok = sum(1 for x in results if x["ok"])
          fail = len(results) - ok
          report = {"requested":len(entries),"success":ok,"failed":fail,"results":results}
          (out / "_recovery-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(f"SUMMARY success={ok} failed={fail}")
          PY
      - name: Upload recovered originals
        uses: actions/upload-artifact@v4
        with:
          name: superii-component-originals
          path: component-images/
          if-no-files-found: error
          retention-days: 1
