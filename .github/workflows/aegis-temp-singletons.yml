name: Aegis singleton exact official recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-singletons.yml"]
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0 pymupdf==1.26.5
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests,fitz
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from PIL import Image,ImageStat
          out=pathlib.Path("singletons");out.mkdir(exist_ok=True)
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"*/*"})
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def good(b):
            try:im=Image.open(io.BytesIO(b));im.load();return len(b)>2500 and im.width>=140 and im.height>=100
            except:return False
          def ext(b,u=""):
            try:f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          def page_exact(idx,maker,name,page,needle,verify=True):
            try:r=S.get(page,timeout=25,verify=verify);r.raise_for_status()
            except Exception as e:return {"index":idx,"name":name,"ok":False,"error":f"GET:{type(e).__name__}:{e}"}
            s=BeautifulSoup(r.text,"html.parser");cand=[]
            for i,tag in enumerate(s.find_all("img")):
              src=tag.get("src") or tag.get("data-src") or tag.get("data-original") or tag.get("data-lazy-src")
              if not src:continue
              u=urljoin(r.url,src);label=(tag.get("alt") or "")+" "+(tag.get("title") or "");lu=u.lower()
              if any(z in lu for z in ("logo","icon","favicon","banner","footer","header","qr","wechat","arrow")):continue
              sc=0
              if norm(needle) in norm(label):sc=5000
              elif norm(needle) in norm(u):sc=4500
              elif norm(name) in norm(label):sc=4000
              elif i<20:sc=500-i
              cand.append((sc,u,label,i))
            for sc,u,label,i in sorted(cand,reverse=True)[:30]:
              if sc<400:continue
              try:
                ir=S.get(u,headers={"Referer":r.url},timeout=15,verify=verify);ir.raise_for_status();b=ir.content
                if not good(b):continue
                im=Image.open(io.BytesIO(b));w,h=im.size
                if max(w/h,h/w)>5:continue
                fn=f"{idx:03d} - {maker} - {name}{ext(b,u)}";(out/fn).write_bytes(b)
                return {"index":idx,"name":name,"ok":True,"file":fn,"source":ir.url,"dimensions":[w,h],"label":label,"score":sc}
              except:pass
            return {"index":idx,"name":name,"ok":False,"error":f"no exact image {len(cand)}"}
          R=[]
          R.append(page_exact(59,"AgileTact","Data Capture Gloves","https://www.agiletact.com/products?ut_language=en-US","Data Collection Gloves"))
          R.append(page_exact(431,"Fine-Motion","SHPR-10C","https://www.finemotion.com.cn/home/Index/product?id=7","SHPR-10C",False))
          R.append(page_exact(495,"Orbbec Inc.","WristCam","https://www.orbbec.com/robot-free-data-collection/","Orbbec Wrist-1"))
          # Mech-Metrics: official Mech-Mind brochure, exact page text + largest software panel image.
          u="https://www.mech-mind.com.cn/Private/Files/638451722363202861778737035.pdf"
          try:
            r=S.get(u,timeout=35);r.raise_for_status();d=fitz.open(stream=r.content,filetype="pdf");best=None
            for p in range(len(d)):
              t=d[p].get_text("text")
              if "Mech-Metrics" not in t:continue
              for im in d[p].get_images(full=True):
                try:
                  z=d.extract_image(im[0]);b=z["image"];w=z.get("width",0);h=z.get("height",0)
                  if not good(b) or max(w/h,h/w)>6:continue
                  # Prefer UI-like medium/large screenshots over tiny logos.
                  score=w*h+len(b)*4
                  if best is None or score>best[0]:best=(score,b,p,w,h)
                except:pass
            if best:
              _,b,p,w,h=best;fn=f"324 - Mech-Mind - Mech-Metrics{ext(b)}";(out/fn).write_bytes(b)
              R.append({"index":324,"name":"Mech-Metrics","ok":True,"file":fn,"source":u+f"#page={p+1}","dimensions":[w,h],"evidence":"official Mech-Mind inline-measurement brochure"})
            else:R.append({"index":324,"name":"Mech-Metrics","ok":False,"error":"no embedded image on exact page"})
          except Exception as e:R.append({"index":324,"name":"Mech-Metrics","ok":False,"error":str(e)})
          print(json.dumps(R,ensure_ascii=False,indent=2))
          (out/"_report.json").write_text(json.dumps({"results":R},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: superii-singletons, path: "singletons/", retention-days: 1}
