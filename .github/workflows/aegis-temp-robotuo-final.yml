name: Aegis Robotuo exact-card final recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-robotuo-final.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from PIL import Image

          root=pathlib.Path(".");out=pathlib.Path("robotuo-final");out.mkdir(exist_ok=True)
          manifest=json.loads((root/".aegis-temp/component-images-missing-final.json").read_text())["missing"]
          page="https://www.robotuo.com/robots/"
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8","Accept-Language":"en-US,en;q=0.9"})
          r=S.get(page,timeout=30);r.raise_for_status()
          soup=BeautifulSoup(r.text,"html.parser")
          cards=[]
          for art in soup.select("article.seo-card"):
            h=art.find("h3")
            img=art.find("img")
            if not h or not img:continue
            name=h.get_text(" ",strip=True)
            src=img.get("src") or img.get("data-src")
            ps=art.find_all("p")
            maker=ps[-1].get_text(" ",strip=True) if ps else ""
            href=(h.find("a") or {}).get("href") if h.find("a") else ""
            cards.append({"name":name,"src":src,"maker":maker,"href":href})
          aliases={
            "DH-Robotics Technology Co., Ltd.":"DH-Robotics",
            "Zhejiang Fine-Motion Robot Joint Technology":"Fine-Motion",
            "Mech-Mind Robotics":"Mech-Mind",
          }
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def clean(s):
            s=re.sub(r'[\\/:*?"<>|]+','-',str(s or '')).strip();s=re.sub(r'\s+',' ',s)
            return s[:100].strip(' .-') or "Unknown"
          def valid(b):
            try:
              im=Image.open(io.BytesIO(b));im.load()
              return len(b)>1000 and im.width>=120 and im.height>=90
            except:return False
          def ext(b,u):
            try:
              f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:
              e=pathlib.Path(urlparse(u).path).suffix.lower();return ".webp" if not e else e
          results=[]
          for it in manifest:
            idx,name,maker=it["index"],it["name"],it["manufacturer"]
            matches=[c for c in cards if c["name"].strip().casefold()==name.strip().casefold()]
            # If duplicate exact names exist, use manufacturer as tie-breaker.
            if len(matches)>1:
              mn=norm(maker); simp=norm(aliases.get(maker,maker))
              preferred=[c for c in matches if simp in norm(c["maker"]) or norm(c["maker"]) in simp or mn in norm(c["maker"])]
              if preferred:matches=preferred
            row={"index":idx,"name":name,"manufacturer":maker,"matches":len(matches),"ok":False}
            if not matches:
              row["error"]="exact card not found";results.append(row);print(json.dumps(row,ensure_ascii=False),flush=True);continue
            c=matches[0];u=urljoin(r.url,c["src"])
            tries=[u]
            # Some deployments serve media at root rather than under /robots/.
            if "/robots/media/" in u:tries.append(u.replace("/robots/media/","/media/"))
            for q in tries:
              try:
                ir=S.get(q,headers={"Referer":r.url},timeout=20);ir.raise_for_status();b=ir.content
                if not valid(b):continue
                im=Image.open(io.BytesIO(b))
                display_maker=aliases.get(maker,maker)
                fn=f"{idx:03d} - {clean(display_maker)} - {clean(name)}{ext(b,ir.url)}"
                (out/fn).write_bytes(b)
                row.update({"ok":True,"file":fn,"source":ir.url,"dimensions":[im.width,im.height],"bytes":len(b),"card_maker":c["maker"],"card_href":c["href"],"evidence":"Robotuo exact server-rendered catalogue card"})
                break
              except Exception as e:
                row.setdefault("attempt_errors",[]).append(f"{q}:{type(e).__name__}:{e}")
            if not row["ok"]:row["error"]="image download failed"
            results.append(row);print(json.dumps(row,ensure_ascii=False),flush=True)
          ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":len(results),"success":ok,"failed":len(results)-ok,"results":results},ensure_ascii=False,indent=2))
          print(f"SUMMARY success={ok} failed={len(results)-ok}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-robotuo-final
          path: robotuo-final/
          retention-days: 1
