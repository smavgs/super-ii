name: Aegis TC Drive exact recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-tcdrive.yml"]
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,io,json,pathlib,re
          from urllib.parse import urljoin,urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          out=pathlib.Path("tcdrive");out.mkdir(exist_ok=True)
          T=[(149,"HSG-HS-C-H","https://www.tc-drive.com/product/3.html"),(150,"HSG-HS-C-J","https://www.tc-drive.com/product/12.html"),(151,"HSG-HS-S-C","https://www.tc-drive.com/product/14.html"),(152,"HSG-HS-S-H","https://www.tc-drive.com/product/13.html")]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0","Accept":"text/html,image/*,*/*;q=.8"})
          def n(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def good(b):
            try: im=Image.open(io.BytesIO(b));im.load();return len(b)>3000 and im.width>=160 and im.height>=120
            except:return False
          def ext(b,u):
            try:f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          def one(t):
            idx,name,page=t; nn=n(name)
            try:r=S.get(page,timeout=20);r.raise_for_status()
            except Exception as e:return {"index":idx,"name":name,"ok":False,"error":str(e)}
            soup=BeautifulSoup(r.text,"html.parser");txt=soup.get_text(" ",strip=True)
            # accept family page because URL itself is exact source from record
            cand=[]
            for i,tag in enumerate(soup.find_all("img")):
              src=tag.get("src") or tag.get("data-src") or tag.get("data-original") or tag.get("data-lazy-src")
              if not src:continue
              u=urljoin(r.url,src);lu=u.lower();label=(tag.get("alt") or "")+" "+(tag.get("title") or "")
              if any(x in lu for x in ("logo","icon","home","banner","footer","header","qr","wechat","arrow")):continue
              score=0
              if nn in n(label):score=3000
              elif nn in n(u):score=2500
              # exact detail page: early non-chrome images are strong
              elif i<18:score=700-i
              elif "product" in lu or "upload" in lu:score=300
              cand.append((score,u,label,i))
            for tag in soup.find_all("meta"):
              key=(tag.get("property") or tag.get("name") or "").lower()
              if key in ("og:image","twitter:image") and tag.get("content"):cand.append((1200,urljoin(r.url,tag["content"]),"meta",-1))
            best=None
            for score,u,label,i in sorted(cand,reverse=True)[:25]:
              if score<250:continue
              try:
                ir=S.get(u,headers={"Referer":r.url},timeout=15);ir.raise_for_status();b=ir.content
                if not good(b):continue
                im=Image.open(io.BytesIO(b));w,h=im.size
                if max(w/h,h/w)>5:continue
                s2=score*10000000+w*h+len(b)
                if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,label,i,score)
              except:pass
            if not best:return {"index":idx,"name":name,"ok":False,"error":"no-image"}
            _,b,u,w,h,label,i,score=best
            fn=f"{idx:03d} - TC Drive - {name.replace('/','-')}{ext(b,u)}";(out/fn).write_bytes(b)
            return {"index":idx,"name":name,"ok":True,"file":fn,"source":u,"dimensions":[w,h],"label":label,"order":i,"score":score}
          R=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            for f in concurrent.futures.as_completed([ex.submit(one,t) for t in T]):
              x=f.result();R.append(x);print(json.dumps(x),flush=True)
          R.sort(key=lambda x:x["index"]);ok=sum(x.get("ok",False) for x in R)
          (out/"_report.json").write_text(json.dumps({"success":ok,"results":R},indent=2));print("SUMMARY",ok)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: superii-tcdrive, path: "tcdrive/", retention-days: 1}
