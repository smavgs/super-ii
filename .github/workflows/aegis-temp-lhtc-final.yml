name: Aegis LH-TC final exact modules
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-lhtc-final.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - name: Recover exact dedicated LH-TC module images
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re
          from urllib.parse import urljoin,urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          root=pathlib.Path("."); out=root/"lhtc-final"; out.mkdir(exist_ok=True)
          records={
            217:("086c96cf-6b02-4553-bf88-c45d0bd18f92","LMO-C28-BM01-AF03",None),
            218:("a863ac28-1848-44d1-8f2e-c7b718c627db","LMO-C31-SM03C","https://www.zzlhjqr.com/module-144.html"),
            222:("827e8fde-919d-4590-8982-31a2dd1d4ecf","LMO-C53B-SM22-MS12- SM02C-BI01",None),
            224:("d79e553f-c170-4323-8e12-d91bc4a28f8b","LMO-E01F",None),
            225:("9097cac7-ded4-4d30-a68f-a08eae5c60c5","LMO-E03F","https://www.zzlhjqr.com/module-134.html"),
            226:("1c5a8f5e-a001-464e-908e-adc21a2947e7","LMO-E04","https://www.zzlhjqr.com/module-123.html"),
            229:("e00f34c3-3396-49a7-bf5d-a2047ede7cfe","LMO-E13-SM10B","https://www.zzlhjqr.com/module-44.html"),
            230:("592d046e-0b90-4604-b801-9b8e656843eb","LMO-E13-U02A-U02A","https://www.zzlhjqr.com/module-48.html"),
            231:("17a7dd1c-4760-4d28-b76e-dfc90e9923aa","LMO-E16-MS07A-AF01","https://www.zzlhjqr.com/module-60.html"),
            233:("5cc4b5e7-af4b-4a11-8315-72281537a95a","LMO-F22-E06A-E06A","https://www.zzlhjqr.com/module-79.html"),
            238:("ac0d1b4b-98ef-4720-950e-49f82d6ae763","LMO-L01B","https://www.zzlhjqr.com/module-58.html"),
            239:("a2e299f7-08bd-440b-a38a-1a74b54ad4e2","LMO-L03N-03",None),
            241:("777afd35-073a-40a2-87fb-edb5e05039f3","LMO-S06-RJ45C","https://www.zzlhjqr.com/module-121.html"),
            243:("7097a7a4-da2e-4de1-ab27-6be6d1524a14","LMO-S08B","https://www.zzlhjqr.com/module-95.html"),
            246:("ed0ef52d-b495-47a3-bec2-6e42d50bca3a","LMO-SM20B","https://www.zzlhjqr.com/module-124.html"),
            248:("6fa980b5-9693-434a-80e2-251530de2d0e","LMO-U02D","https://www.zzlhjqr.com/module-63.html"),
            249:("935a7190-0d10-474d-9da5-800472dddd9f","LMO-U04A","https://www.zzlhjqr.com/module-64.html"),
            250:("7b36568a-6503-430e-839c-8e378237ccd4","LMO-XZ-01","https://www.zzlhjqr.com/module-100.html"),
            280:("5cc610d4-dd5a-4b11-a5ad-2db0b11c4154","LTC-0040TK","https://www.zzlhjqr.com/module-176.html"),
            414:("99b0f96e-58e4-48e6-96a5-0276a39b96d1","Safety docking assembly-2","https://www.zzlhjqr.com/module-180.html"),
            415:("c386a9ac-7671-4265-b57d-f143317f66aa","Safety docking assembly-3","https://www.zzlhjqr.com/module-181.html"),
          }
          S=requests.Session(); S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def clean(s):
            s=re.sub(r'[\\/:*?"<>|]+','-',str(s or '')).strip();s=re.sub(r'\s+',' ',s)
            return s[:105].strip(' .-') or "Unknown"
          def get(u,ref=None):
            h={"Referer":ref} if ref else {}
            r=S.get(u,headers=h,timeout=20,allow_redirects=True);r.raise_for_status();return r
          def discover(model):
            modeln=norm(model)
            for parent in ("https://www.zzlhjqr.com/ltc-44.html","https://www.zzlhjqr.com/ltc-34.html","https://www.zzlhjqr.com/ltc-35.html","https://www.zzlhjqr.com/ltc-29.html","https://www.zzlhjqr.com/ltc-20.html"):
              try:r=get(parent);s=BeautifulSoup(r.text,"html.parser")
              except:continue
              for a in s.find_all("a",href=True):
                p=a
                block=""
                for _ in range(4):
                  if p is None:break
                  block+=" "+p.get_text(" ",strip=True)
                  if modeln in norm(block):
                    u=urljoin(r.url,a["href"])
                    if re.search(r"/module-\d+\.html",u):
                      return u
                  p=p.parent
            return None
          def valid(b):
            try:
              im=Image.open(io.BytesIO(b));im.load()
              return im.width>=160 and im.height>=120 and max(im.width/im.height,im.height/im.width)<5
            except:return False
          def choose(page,model):
            r=get(page);s=BeautifulSoup(r.text,"html.parser")
            # Exact module pages may use Chinese generic titles; require module URL + meaningful product image.
            imgs=[]
            for i,t in enumerate(s.find_all("img")):
              src=t.get("src")
              if not src:continue
              u=urljoin(r.url,src);p=urlparse(u).path.lower()
              if "/static/index/" in p:continue
              if any(x in p for x in ("logo","banner","qr","erwe","call","phone","top_")):continue
              score=0
              if "/images/" in p:score=100
              elif "/uploads/" in p:score=70
              else:continue
              if i<12:score+=50
              imgs.append((score,i,u))
            imgs.sort(key=lambda z:(-z[0],z[1]))
            for score,i,u in imgs[:8]:
              try:
                ir=get(u,r.url);b=ir.content
                if not valid(b):continue
                im=Image.open(io.BytesIO(b))
                return b,ir.url,[im.width,im.height],score,i,r.url
              except:pass
            return None
          results=[]
          for idx,(rid,model,page) in records.items():
            if not page:page=discover(model)
            if not page:
              results.append({"index":idx,"name":model,"ok":False,"error":"no dedicated page"});continue
            try:z=choose(page,model)
            except Exception as e:
              results.append({"index":idx,"name":model,"ok":False,"page":page,"error":str(e)});continue
            if not z:
              results.append({"index":idx,"name":model,"ok":False,"page":page,"error":"no product gallery"});continue
            b,src,dims,score,order,final=z
            e=pathlib.Path(urlparse(src).path).suffix.lower()
            if e not in (".jpg",".jpeg",".png",".webp"):e=".jpg"
            if e==".jpeg":e=".jpg"
            fn=f"{idx:03d} - LH-TC - {clean(model)}{e}"
            (out/fn).write_bytes(b)
            results.append({"index":idx,"name":model,"ok":True,"file":fn,"page":final,"source":src,"dimensions":dims,"score":score,"img_order":order})
            print(json.dumps(results[-1],ensure_ascii=False),flush=True)
          ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"success":ok,"failed":len(results)-ok,"results":results},ensure_ascii=False,indent=2))
          print("SUMMARY",ok,len(results)-ok)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-lhtc-final
          path: lhtc-final/
          retention-days: 1
