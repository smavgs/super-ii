name: Aegis Robots.com original media recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-robots-media.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --quiet requests==2.32.5 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests
          from PIL import Image
          root=pathlib.Path(".");out=pathlib.Path("robots-media");out.mkdir(exist_ok=True)
          manifest=json.loads((root/".aegis-temp/component-images-missing-6.json").read_text())["missing"]
          S=requests.Session()
          S.headers.update({
            "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
            "Accept":"image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
            "Accept-Language":"en-US,en;q=0.9",
            "Referer":"https://www.robots.com/"
          })
          aliases={"Jiangsu DINGS' Intelligent Control Technology Co., Ltd.":"DINGS","DH-Robotics Technology Co., Ltd.":"DH-Robotics","Nanchang Kude Intelligent Technology Co., Ltd.":"CubeMars","Mech-Mind Robotics":"Mech-Mind","Zhejiang Fine-Motion Robot Joint Technology":"Fine-Motion"}
          def clean(s):
            s=re.sub(r'[\\/:*?"<>|]+','-',str(s or '')).strip();s=re.sub(r'\s+',' ',s)
            return s[:100].strip(' .-') or "Unknown"
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def valid(b):
            try:
              im=Image.open(io.BytesIO(b));im.load()
              return len(b)>1000 and im.width>=120 and im.height>=90
            except:return False
          def ext(b):
            try:
              f=Image.open(io.BytesIO(b)).format.lower()
              return ".jpg" if f=="jpeg" else "."+f
            except:return ".webp"
          results=[]
          for it in manifest:
            idx,rid=it["index"],it["id"]
            try:rec=json.loads((root/"public/robot-library/records"/f"{rid}.json").read_text())
            except Exception as e:
              results.append({"index":idx,"name":it.get("name"),"ok":False,"error":f"record:{e}"});continue
            name=rec.get("name") or it.get("name") or rid
            maker=((rec.get("makers") or [{}])[0].get("name") or it.get("manufacturer") or "Unknown")
            maker=aliases.get(maker,maker)
            urls=rec.get("source_images") or []
            row={"index":idx,"name":name,"maker":maker,"ok":False,"attempts":[]}
            for u in urls[:3]:
              tries=[u]
              if "www.robots.com/" in u: tries.append(u.replace("https://www.robots.com/","https://robots.com/"))
              for q in tries:
                try:
                  r=S.get(q,timeout=20,allow_redirects=True)
                  row["attempts"].append({"url":q,"status":r.status_code,"ct":r.headers.get("content-type"),"bytes":len(r.content),"final":r.url})
                  if r.status_code!=200 or not valid(r.content):continue
                  b=r.content; im=Image.open(io.BytesIO(b))
                  fam=((rec.get("family") or {}).get("name") or "")
                  parts=[f"{idx:03d}",clean(maker)]
                  if fam and norm(fam)!=norm(name):parts.append(clean(fam))
                  parts.append(clean(name))
                  fn=" - ".join(parts)+ext(b)
                  (out/fn).write_bytes(b)
                  row.update({"ok":True,"file":fn,"source":r.url,"dimensions":[im.width,im.height],"bytes":len(b),"evidence":"preserved-robots-source-image"})
                  break
                except Exception as e:
                  row["attempts"].append({"url":q,"error":f"{type(e).__name__}:{e}"})
              if row["ok"]:break
            results.append(row);print(json.dumps(row,ensure_ascii=False),flush=True)
          ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":len(results),"success":ok,"failed":len(results)-ok,"results":results},ensure_ascii=False,indent=2))
          print(f"SUMMARY success={ok} failed={len(results)-ok}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-robots-media
          path: robots-media/
          retention-days: 1
