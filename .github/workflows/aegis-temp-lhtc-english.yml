name: Aegis LH-TC English exact images
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-lhtc-english.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from PIL import Image
          out=pathlib.Path("lhtc-english");out.mkdir(exist_ok=True)
          T=[
            (263,"LT-F31C","https://www.ltautotools.com/products/lt-f31c-utility-coupler.html"),
            (265,"LT-FEC-PM72-S60","https://www.ltautotools.com/products/lt-fec-pm72-s60.html"),
          ]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def good(b):
            try:
              im=Image.open(io.BytesIO(b));im.load();return len(b)>1800 and im.width>=160 and im.height>=100
            except:return False
          def ext(b,u):
            try:f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          rows=[]
          for idx,name,page in T:
            row={"index":idx,"name":name,"page":page,"ok":False}
            try:
              r=S.get(page,timeout=25);r.raise_for_status();s=BeautifulSoup(r.text,"html.parser")
              if norm(name) not in norm((s.title.get_text(" ",strip=True) if s.title else "")+" "+s.get_text(" ",strip=True)[:8000]):raise ValueError("model-absent")
              cand=[]
              for i,tag in enumerate(s.find_all("img")):
                vals=[tag.get(k) for k in ("src","data-src","data-original","data-lazy-src") if tag.get(k)]
                lab=(tag.get("alt") or "")+" "+(tag.get("title") or "")
                for v in vals:
                  u=urljoin(r.url,v);lu=u.lower()
                  if any(x in lu for x in ("logo","icon","favicon","banner","footer","header","qr","wechat","tel","service")):continue
                  score=0
                  if norm(name) in norm(lab):score=10000
                  elif norm(name) in norm(u):score=9000
                  elif i<20 and any(x in lu for x in ("product","upload","uploads","images")):score=4000-i*20
                  cand.append((score,u,lab,i))
              for st in s.find_all(string=True):
                if norm(name) not in norm(st):continue
                p=st.parent
                for depth in range(6):
                  if not p:break
                  for tag in p.find_all("img",limit=15):
                    src=tag.get("src") or tag.get("data-src")
                    if src:cand.append((8000-depth*300,urljoin(r.url,src),tag.get("alt") or "same-block",-1))
                  p=p.parent
              best=None
              for score,u,lab,i in sorted(cand,reverse=True)[:30]:
                if score<2000:continue
                try:
                  ir=S.get(u,headers={"Referer":r.url},timeout=15);ir.raise_for_status();b=ir.content
                  if not good(b):continue
                  im=Image.open(io.BytesIO(b));w,h=im.size
                  if max(w/h,h/w)>5:continue
                  s2=score*10000000+w*h+len(b)
                  if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,lab,i,score)
                except:pass
              if not best:raise ValueError(f"no-valid-image {len(cand)} candidates")
              _,b,u,w,h,lab,i,score=best
              fn=f"{idx:03d} - LH-TC - {name}{ext(b,u)}";(out/fn).write_bytes(b)
              row.update({"ok":True,"file":fn,"source":u,"dimensions":[w,h],"label":lab,"dom_index":i,"score":score})
            except Exception as e:row["error"]=f"{type(e).__name__}:{e}"
            rows.append(row);print(json.dumps(row,ensure_ascii=False))
          (out/"_report.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-lhtc-english
          path: lhtc-english/
          retention-days: 1
