name: Aegis exact official remaining batch
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-exact-remaining.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - name: Recover exact official product images
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,io,json,pathlib,re
          from urllib.parse import urljoin,urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          out=pathlib.Path("exact-remaining");out.mkdir(exist_ok=True)
          targets=[
            (206,"LENFOR","LF-MERG34-15-35-RR","https://www.lenfortech.com/products/model/LF-MERG34-15-35-RR"),
            (207,"LENFOR","LF-MFGF29-26-100-SR-DD","https://www.lenfortech.com/products/model/LF-MFGF29-26-100-SR-DD"),
            (208,"LENFOR","LF-MSEC35-100-50-DR-DB","https://www.lenfortech.com/products/model/LF-MSEC35-100-50-DR-DB"),
            (209,"LENFOR","LF-RH1X-1L","https://www.lenfortech.com/products/model/LF-RH1X-1L"),
            (158,"HCFA","Hu-MLS","https://www.hcfa.cn/product/lists/spid/10160,10161/cid/10167.html"),
            (162,"ZeroErr","I/O Adapter Board","https://www.zeroerr.com/products/accessories/io_adapter_board"),
            (79,"ZeroErr","eRob to PC Connector","https://www.zeroerr.com/accessories"),
            (431,"Fine-Motion","SHPR-10C","https://www.finemotion.com.cn/home/Index/product?id=7"),
            (495,"Orbbec","WristCam","https://www.orbbec.com/robot-free-data-collection/"),
            (263,"LH-TC","LT-F31C","https://www.zzlhjqr.com/ltfd.html"),
            (265,"LH-TC","LT-FEC-PM72-S60","https://www.zzlhjqr.com/ltfd.html"),
            (324,"Mech-Mind","Mech-Metrics","https://www.mech-mind.com/solution/3d-inline-measurement-solution-mech-mind-robotics.html"),
          ]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8","Accept-Language":"en-US,en;q=0.9,zh-CN;q=0.8"})
          BAD=("logo","icon","favicon","banner","header","footer","wechat","weixin","qr","qrcode","avatar","arrow","search","menu","language","tel","phone","map","service")
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def clean(s):
            s=re.sub(r'[\\/:*?"<>|]+','-',str(s or '')).strip();s=re.sub(r'\s+',' ',s)
            return s[:100].strip(' .-') or "Unknown"
          def valid(b):
            try:
              im=Image.open(io.BytesIO(b));im.load();return len(b)>1800 and im.width>=140 and im.height>=100
            except:return False
          def ext(b,u):
            try:
              f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:
              e=pathlib.Path(urlparse(u).path).suffix.lower();return ".jpg" if e not in (".jpg",".jpeg",".png",".webp") else (".jpg" if e==".jpeg" else e)
          def get(u,ref=None,t=20):
            h={"Referer":ref} if ref else {}
            r=S.get(u,headers=h,timeout=t,allow_redirects=True);r.raise_for_status();return r
          def urls_from_tag(tag,base):
            arr=[]
            for a in ("src","data-src","data-original","data-lazy-src","data-url"):
              v=tag.get(a)
              if isinstance(v,str) and v.strip():arr.append(v.strip())
            ss=tag.get("srcset")
            if isinstance(ss,str):arr += [x.strip().split()[0] for x in ss.split(",") if x.strip()]
            return [urljoin(base,x) for x in arr]
          def collect_near_model(soup,html,base,name):
            n=norm(name);cand=[]
            # Exact alt/title/URL images.
            for tag in soup.find_all("img"):
              label=(tag.get("alt") or "")+" "+(tag.get("title") or "")
              for u in urls_from_tag(tag,base):
                if any(b in norm(u) for b in BAD):continue
                score=0
                if n in norm(label):score=5000
                elif n in norm(u):score=4500
                elif name.lower() in label.lower():score=5000
                if score:cand.append((score,u,"exact-alt-url"))
            # Find text nodes with model, ascend local product block.
            nodes=[]
            for s in soup.find_all(string=True):
              if n and n in norm(s):nodes.append(s)
            for node in nodes[:20]:
              p=node.parent
              for depth in range(7):
                if not p:break
                imgs=[]
                for tag in p.find_all("img",limit=20):
                  imgs += urls_from_tag(tag,base)
                for u in imgs:
                  if any(b in norm(u) for b in BAD):continue
                  cand.append((4000-depth*250,u,"same-product-block"))
                if imgs:break
                p=p.parent
            # raw model window
            for m in re.finditer(r'''["']([^"'<> ]+\.(?:png|jpe?g|webp)(?:\?[^"'<> ]*)?)["']''',html,re.I):
              u=urljoin(base,m.group(1).replace("\\/","/"))
              if any(b in norm(u) for b in BAD):continue
              a=max(0,m.start()-3500);b=min(len(html),m.end()+3500)
              if n in norm(html[a:b]):cand.append((3500,u,"raw-near-model"))
            # meta is acceptable only on exact detail page.
            page_text=norm(soup.get_text(" ",strip=True))
            exact_page=n in page_text
            if exact_page:
              for tag in soup.find_all("meta"):
                k=(tag.get("property") or tag.get("name") or "").lower()
                if k in ("og:image","og:image:url","twitter:image") and tag.get("content"):
                  cand.append((1200,urljoin(base,tag["content"]),"meta-exact-page"))
            uniq={}
            for s,u,w in cand:
              if u not in uniq or s>uniq[u][0]:uniq[u]=(s,w)
            return sorted(((s,u,w) for u,(s,w) in uniq.items()),reverse=True)
          def one(t):
            idx,maker,name,page=t;n=norm(name)
            try:r=get(page)
            except Exception as e:return {"index":idx,"name":name,"ok":False,"error":f"page:{type(e).__name__}:{e}"}
            soup=BeautifulSoup(r.text,"html.parser")
            if n not in norm(soup.get_text(" ",strip=True)) and n not in norm(soup.title.get_text(" ",strip=True) if soup.title else ""):
              return {"index":idx,"name":name,"ok":False,"error":"model not present on official page"}
            cand=collect_near_model(soup,r.text,r.url,name)
            best=None
            for score,u,why in cand[:30]:
              if score<1000:continue
              try:
                ir=get(u,r.url,15);b=ir.content
                if not valid(b):continue
                im=Image.open(io.BytesIO(b));w,h=im.size;ratio=max(w/h,h/w)
                if ratio>5:continue
                s2=score*10000000+w*h+min(len(b),1000000)
                if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,why,score)
              except:pass
            if not best:return {"index":idx,"name":name,"ok":False,"error":f"no exact usable image ({len(cand)} candidates)"}
            _,b,u,w,h,why,score=best
            fn=f"{idx:03d} - {maker} - {clean(name)}{ext(b,u)}";(out/fn).write_bytes(b)
            return {"index":idx,"name":name,"ok":True,"file":fn,"page":r.url,"source":u,"dimensions":[w,h],"evidence":why,"score":score}
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
            for f in concurrent.futures.as_completed([ex.submit(one,t) for t in targets]):
              try:x=f.result()
              except Exception as e:x={"ok":False,"error":str(e)}
              results.append(x);print(json.dumps(x,ensure_ascii=False),flush=True)
          results.sort(key=lambda x:x.get("index",9999));ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":len(targets),"success":ok,"failed":len(targets)-ok,"results":results},ensure_ascii=False,indent=2))
          print(f"SUMMARY success={ok} failed={len(targets)-ok}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-exact-remaining
          path: exact-remaining/
          retention-days: 1
