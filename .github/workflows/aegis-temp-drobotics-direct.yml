name: Aegis D-Robotics direct official images
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-drobotics-direct.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - name: Download exact D-Robotics official images
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from PIL import Image

          out=pathlib.Path("drobotics-direct");out.mkdir(exist_ok=True)
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0","Accept":"image/avif,image/webp,image/*,*/*;q=0.8,text/html"})
          direct=[
            (395,"RDK S100","https://rdk-doc.oss-cn-beijing.aliyuncs.com/doc/img/01_Quick_start/image/hardware_interface/image-rdk_100_mainboard_overview.png"),
            (397,"RDK X3","https://rdk-doc.oss-cn-beijing.aliyuncs.com/doc/img/01_Quick_start/image/hardware_interface/image-20220802160110194.jpg"),
            (398,"RDK X3 Module","https://rdk-doc.oss-cn-beijing.aliyuncs.com/doc/img/01_Quick_start/image/hardware_interface/image-carrier-board1.jpg"),
            (399,"RDK X5","https://rdk-doc.oss-cn-beijing.aliyuncs.com/doc/img/01_Quick_start/image/hardware_interface/RDK_X5_interface.jpg"),
          ]
          def valid(b):
            try:
              im=Image.open(io.BytesIO(b));im.load();return len(b)>2500 and im.width>=250 and im.height>=150
            except:return False
          def ext(b,u):
            try:f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return pathlib.Path(urlparse(u).path).suffix or ".jpg"
          results=[]
          for idx,name,u in direct:
            try:
              r=S.get(u,timeout=25);r.raise_for_status();b=r.content
              if not valid(b):raise ValueError("invalid-image")
              im=Image.open(io.BytesIO(b));fn=f"{idx:03d} - D-Robotics - {name}{ext(b,u)}";(out/fn).write_bytes(b)
              results.append({"index":idx,"name":name,"ok":True,"file":fn,"source":u,"dimensions":[im.width,im.height],"evidence":"official-doc-direct-image"})
            except Exception as e:results.append({"index":idx,"name":name,"ok":False,"error":str(e)})
          # S600: find the product-introduction image on the official current docs page.
          idx,name=396,"RDK S600"
          page="https://d-robotics.github.io/rdk_s_doc/en/RDK/?p=RDK+S600&v=5.1.1"
          try:
            r=S.get(page,timeout=25);r.raise_for_status();s=BeautifulSoup(r.text,"html.parser")
            cand=[]
            for tag in s.find_all("img"):
              src=tag.get("src") or tag.get("data-src")
              if not src:continue
              u=urljoin(r.url,src);lab=(tag.get("alt") or "")+" "+(tag.get("title") or "")
              score=0
              if "s600" in (lab+" "+u).lower():score+=2000
              if "product" in (lab+" "+u).lower() or "introduction" in (lab+" "+u).lower():score+=1200
              if any(x in u.lower() for x in ("logo","icon","favicon","diagram","architecture")):score-=2000
              cand.append((score,u,lab))
            best=None
            for score,u,lab in sorted(cand,reverse=True)[:20]:
              if score<=0:continue
              try:
                ir=S.get(u,headers={"Referer":r.url},timeout=15);ir.raise_for_status();b=ir.content
                if not valid(b):continue
                im=Image.open(io.BytesIO(b));w,h=im.size
                s2=score*10000000+w*h+len(b)
                if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,lab,score)
              except:pass
            if not best:raise ValueError(f"no S600 product image ({len(cand)} candidates)")
            _,b,u,w,h,lab,score=best;fn=f"396 - D-Robotics - RDK S600{ext(b,u)}";(out/fn).write_bytes(b)
            results.append({"index":396,"name":"RDK S600","ok":True,"file":fn,"source":u,"dimensions":[w,h],"label":lab,"score":score,"evidence":"official-current-doc-product-image"})
          except Exception as e:results.append({"index":396,"name":"RDK S600","ok":False,"error":str(e)})
          results.sort(key=lambda x:x["index"]);ok=sum(x.get("ok",False) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":5,"success":ok,"failed":5-ok,"results":results},ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-drobotics-direct
          path: drobotics-direct/
          retention-days: 1
