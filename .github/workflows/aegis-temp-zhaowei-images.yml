name: Aegis temporary ZHAOWEI component images
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-zhaowei-images.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - name: Recover ZHAOWEI product originals
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests,warnings
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from PIL import Image
          warnings.filterwarnings("ignore")
          root=pathlib.Path(".");out=root/"zhaowei-images";out.mkdir(exist_ok=True)
          entries=[x for x in json.loads((root/".aegis-temp/component-images-missing-4.json").read_text())["missing"] if x.get("manufacturer")=="ZHAOWEI"]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 Chrome/155 Safari/537.36","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          BAD=("logo","icon","banner","wechat","qr","footer","header","news","service","case","about","contact")
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def clean(s):return re.sub(r'[\\/:*?"<>|]+','-',str(s or '')).strip()
          def get(u,ref=None):
            h={"Referer":ref} if ref else {}
            try:r=S.get(u,headers=h,timeout=12,allow_redirects=True);r.raise_for_status();return r
            except requests.exceptions.SSLError:r=S.get(u,headers=h,timeout=12,allow_redirects=True,verify=False);r.raise_for_status();return r
          def valid(b):
            if len(b)<1500:return None
            try:
              im=Image.open(io.BytesIO(b));im.load()
              if im.width<150 or im.height<120:return None
              return im.width,im.height,im.format
            except:return None
          results=[]
          for it in entries:
            idx,rid,name=it["index"],it["id"],it["name"];modeln=norm(name)
            rec=json.loads((root/"public/robot-library/records"/f"{rid}.json").read_text())
            urls=[]
            for x in rec.get("resources") or []:
              u=x.get("url") if isinstance(x,dict) else None
              if u and u.startswith("http"):urls.append(u)
            page=urls[0] if urls else ""
            if not page:
              results.append({"index":idx,"name":name,"ok":False,"error":"no-page"});continue
            try:r=get(page)
            except Exception as e:
              results.append({"index":idx,"name":name,"ok":False,"error":f"page:{e}","page":page});continue
            soup=BeautifulSoup(r.text,"html.parser");c=[]
            # Locate main content and all official wp-content image URLs.
            for tag in soup.find_all("img"):
              vals=[]
              for a in ("src","data-src","data-original","data-lazy-src"):
                v=tag.get(a)
                if v:vals.append(v)
              ss=tag.get("srcset")
              if ss:vals += [z.strip().split()[0] for z in ss.split(",") if z.strip()]
              lab=(tag.get("alt") or "")+" "+(tag.get("title") or "")
              for v in vals:
                u=urljoin(r.url,v);un=norm(u);ln=norm(lab)
                if any(b in un for b in BAD):continue
                boost=0
                if modeln and modeln in ln:boost=1000
                elif modeln and modeln in un:boost=900
                if "wpcontentuploads" in un:boost+=100
                c.append((boost,u,lab))
            # raw wp-content URLs (including JS/lazy attrs)
            for m in re.finditer(r'''https?://[^"'<> ]+?/wp-content/uploads/[^"'<> ]+?\.(?:jpg|jpeg|png|webp)(?:\?[^"'<> ]*)?''',r.text,re.I):
              u=m.group(0).replace("&amp;","&");un=norm(u)
              if any(b in un for b in BAD):continue
              c.append((150+(900 if modeln in un else 0),u,"raw"))
            seen=set();scored=[]
            for boost,u,lab in c:
              if u in seen:continue
              seen.add(u)
              try:
                ir=get(u,r.url);v=valid(ir.content)
                if not v:continue
                w,h,fmt=v;ratio=max(w/h,h/w)
                if ratio>6:continue
                score=boost + min(w*h/10000,300)+min(len(ir.content)/10000,100)
                scored.append((score,ir,w,h,fmt))
              except:pass
            if not scored:
              results.append({"index":idx,"name":name,"ok":False,"error":"no-image","page":page});continue
            scored.sort(key=lambda z:z[0],reverse=True)
            score,ir,w,h,fmt=scored[0]
            ext=".jpg" if (fmt or "").lower()=="jpeg" else "."+(fmt or "jpg").lower()
            fn=f"{idx:03d} - ZHAOWEI - {clean(name)}{ext}"
            (out/fn).write_bytes(ir.content)
            results.append({"index":idx,"name":name,"ok":True,"file":fn,"source":ir.url,"page":page,"dimensions":[w,h],"score":round(score,2)})
          ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":len(entries),"success":ok,"failed":len(entries)-ok,"results":results},ensure_ascii=False,indent=2))
          print(json.dumps({"requested":len(entries),"success":ok,"failed":len(entries)-ok}))
          for x in results:print(json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-zhaowei-images
          path: zhaowei-images/
          if-no-files-found: error
          retention-days: 1
