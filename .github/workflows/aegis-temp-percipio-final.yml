name: Aegis Percipio remaining originals
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-percipio-final.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --quiet requests==2.32.5 pymupdf==1.26.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - name: Extract exact Percipio product originals
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests,fitz
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from PIL import Image
          items={
            104:("FM811-TIX","https://doc.percipio.xyz/cam/datasheet/en/FM811-TIX_Specifications.pdf"),
            106:("FM854-E1","https://en.percipio.xyz/products/hardware/dot-pattern-structured-light-cameras/f-series/57"),
            109:("FS820-E1","https://doc.percipio.xyz/cam/datasheet/en/FS820-E1_Specifications.pdf"),
            372:("PM805-E1","https://doc.percipio.xyz/cam/datasheet/en/PM805-E1_Specifications.pdf"),
            378:("PS801-E1","https://doc.percipio.xyz/cam/datasheet/en/PS801_Series_Specifications.pdf"),
            379:("PS801-N-E1","https://doc.percipio.xyz/cam/datasheet/en/PS801_Series_Specifications.pdf"),
            471:("TL430-E1","https://doc.percipio.xyz/cam/datasheet/en/TL430-E1_Specifications.pdf"),
            472:("TL460-S1-E1","https://doc.percipio.xyz/cam/datasheet/en/TL460-S1-E1_Specifications.pdf"),
            473:("TM260-E1","https://doc.percipio.xyz/cam/datasheet/en/TM260-E1_Specifications.pdf"),
            476:("TM421-E1","https://doc.percipio.xyz/cam/datasheet/en/TM421-E1_Specifications.pdf"),
            477:("TM461-E2","https://doc.percipio.xyz/cam/datasheet/en/TM461-E2_Specifications.pdf"),
          }
          out=pathlib.Path("percipio-final");out.mkdir(exist_ok=True)
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36"})
          def clean(s):return re.sub(r'[\\/:*?"<>|]+','-',s).strip()
          def good_image(b):
            try:
              im=Image.open(io.BytesIO(b));im.load()
              return im.width>=120 and im.height>=100 and max(im.width/im.height,im.height/im.width)<6
            except:return False
          def html_image(url,model):
            r=S.get(url,timeout=20);r.raise_for_status();s=BeautifulSoup(r.text,"html.parser")
            cand=[]
            mn=re.sub(r'[^a-z0-9]+','',model.lower())
            for i,t in enumerate(s.find_all("img")):
              src=t.get("src") or t.get("data-src") or t.get("data-original")
              if not src:continue
              u=urljoin(r.url,src);un=re.sub(r'[^a-z0-9]+','',u.lower())
              if any(x in un for x in ("logo","banner","icon","qr","wechat","footer","header")):continue
              score=0
              if mn in un:score=220
              elif "/uploads/" in urlparse(u).path.lower() or "/upload" in urlparse(u).path.lower():score=120
              if i<20:score+=20
              cand.append((score,i,u))
            cand.sort(key=lambda z:(-z[0],z[1]))
            for score,i,u in cand:
              try:
                ir=S.get(u,headers={"Referer":r.url},timeout=20);ir.raise_for_status()
                if good_image(ir.content):
                  im=Image.open(io.BytesIO(ir.content))
                  return ir.content,ir.url,[im.width,im.height],"html-product",score
              except:pass
            return None
          def pdf_image(url,model):
            r=S.get(url,timeout=25);r.raise_for_status()
            d=fitz.open(stream=r.content,filetype="pdf")
            mn=re.sub(r'[^a-z0-9]+','',model.lower())
            pages=[]
            for p in range(len(d)):
              try:text=d[p].get_text("text")
              except:text=""
              nt=re.sub(r'[^a-z0-9]+','',text.lower())
              if mn in nt:pages.append(p)
            if not pages:pages=list(range(min(2,len(d))))
            best=None
            for p in pages[:4]:
              for im in d[p].get_images(full=True):
                try:
                  z=d.extract_image(im[0]);b=z["image"];w=z.get("width",0);h=z.get("height",0)
                  if len(b)<2000 or w<120 or h<100 or max(w/h,h/w)>6:continue
                  area=w*h
                  # favor photographic/product-size assets, not small icons
                  score=area + len(b)*2
                  if best is None or score>best[0]:best=(score,b,z.get("ext","jpg"),p,w,h)
                except:pass
            if not best:return None
            _,b,e,p,w,h=best
            return b,url+f"#page={p+1}",[w,h],"pdf-embedded-product",200
          results=[]
          for idx,(model,url) in items.items():
            try:
              if url.lower().endswith(".pdf"):z=pdf_image(url,model)
              else:z=html_image(url,model)
              if not z:
                results.append({"index":idx,"name":model,"ok":False,"error":"no image"});continue
              b,src,dims,why,score=z
              try:
                fmt=Image.open(io.BytesIO(b)).format.lower()
                ext=".jpg" if fmt=="jpeg" else "."+fmt
              except:ext=".jpg"
              fn=f"{idx:03d} - Percipio - {clean(model)}{ext}"
              (out/fn).write_bytes(b)
              row={"index":idx,"name":model,"ok":True,"file":fn,"source":src,"dimensions":dims,"evidence":why,"score":score}
              results.append(row);print(json.dumps(row),flush=True)
            except Exception as e:
              results.append({"index":idx,"name":model,"ok":False,"error":str(e)})
          (out/"_report.json").write_text(json.dumps(results,indent=2))
          print("SUMMARY",sum(x.get("ok",False) for x in results),len(results))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-percipio-final
          path: percipio-final/
          retention-days: 1
