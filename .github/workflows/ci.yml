name: Validate and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.24
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm run db:check
      - run: npm run db:test
      - run: uv sync --directory runtime --extra test --frozen
      - run: uv run --directory runtime ruff format --check .
      - run: uv run --directory runtime ruff check .
      - run: uv run --directory runtime pytest
      - run: uv lock --directory runtime/space-image --check
      - run: npm run build
