name: Validate and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.24
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm run db:check
      - run: npm run db:test
      - run: uv sync --directory sdk/python --extra test --frozen
      - run: uv run --directory sdk/python ruff format --check .
      - run: uv run --directory sdk/python ruff check .
      - run: uv run --directory sdk/python pytest
      - run: uv build --directory sdk/python
      - run: uv sync --directory runtime --extra test --frozen
      - run: uv run --directory runtime ruff format --check .
      - run: uv run --directory runtime ruff check .
      - run: uv run --directory runtime pytest
      - run: runtime/.venv/bin/python tools/check_publication_service.py
      - run: uv lock --directory runtime/space-image --check
      - run: uv lock --directory runtime/notebook-image --check
      - run: cargo +1.97.0 fmt --manifest-path rust/Cargo.toml --check
      - run: cargo +1.97.0 build --locked --bins --manifest-path rust/Cargo.toml
      - run: cargo +1.97.0 test --locked --manifest-path rust/Cargo.toml
      - run: cargo +1.97.0 clippy --locked --all-targets --manifest-path rust/Cargo.toml -- -D warnings
      - run: docker build --tag superii/notebook-executor:ci runtime/notebook-image
      - run: docker build --tag superii/transfer:ci rust
      - run: docker compose --file runtime/compose.yaml config --quiet
        env:
          SUPERII_DATABASE_URL: postgresql://example.invalid/db
          SUPERII_RUNTIME_TOKEN: "01234567890123456789012345678901"
          SUPERII_POLICY_DATABASE_URL: postgresql://policy@example.invalid/db
          SUPERII_POLICY_TOKEN: "01234567890123456789012345678901"
          SUPERII_POLICY_SIGNING_KEY: CI_CONFIG_VALIDATION_ONLY
          SUPERII_POLICY_KEY_ID: CI_CONFIG_VALIDATION_ONLY
      - run: npm run build

  recipe-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.24
      - run: uv sync --directory sdk/python --extra test --frozen
      - run: uv pip install --python sdk/python/.venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
      - run: uv pip install --python sdk/python/.venv/bin/python -e 'sdk/python[rag,train,serve,observe]' transformers==5.16.1 peft==0.20.0 trl==1.12.0 faiss-cpu==1.15.0 numpy==2.5.2 gradio==6.26.0 langchain-core==1.6.2
      - run: sdk/python/.venv/bin/python -m pytest sdk/python/tests/test_recipes.py -q
