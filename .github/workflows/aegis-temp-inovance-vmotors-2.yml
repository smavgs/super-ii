name: Aegis Inovance V3 V6 exact motor photos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-inovance-vmotors-2.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from PIL import Image
          items={
            331:("MS1-V3","MS1H3-18C15CB-V334R-INT","https://www.inovance.com/global/content/details_816_595863.html"),
            332:("MS1-V6","MS1H3-29C15CB-V631R-INT","https://www.inovance.com/global/content/details_816_595772.html")
          }
          out=pathlib.Path("vmotors");out.mkdir(exist_ok=True)
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 Chrome/155 Safari/537.36"})
          def norm(x):return re.sub(r"[^a-z0-9]+","",str(x or "").lower())
          rows=[]
          for idx,(series,model,page) in items.items():
            row={"index":idx,"series":series,"model":model,"page":page,"ok":False}
            try:
              r=S.get(page,timeout=25);r.raise_for_status();s=BeautifulSoup(r.text,"html.parser")
              c=[]
              for tag in s.find_all("img"):
                label=(tag.get("alt") or "")+" "+(tag.get("title") or "")
                if norm(model) not in norm(label):continue
                for a in ("src","data-src","data-original","data-lazy-src"):
                  v=tag.get(a)
                  if v:c.append(urljoin(r.url,v))
              best=None
              for u in dict.fromkeys(c):
                try:
                  ir=S.get(u,headers={"Referer":r.url},timeout=15);ir.raise_for_status();b=ir.content
                  im=Image.open(io.BytesIO(b));im.load()
                  if im.width<180 or im.height<120:continue
                  score=im.width*im.height
                  if best is None or score>best[0]:best=(score,b,ir.url,im.width,im.height,im.format)
                except:pass
              if not best:raise ValueError("no exact child model image")
              _,b,u,w,h,fmt=best;ext=".jpg" if fmt.lower()=="jpeg" else "."+fmt.lower()
              fn=f"{idx:03d} - Inovance - {series}{ext}";(out/fn).write_bytes(b)
              row.update({"ok":True,"file":fn,"source":u,"dimensions":[w,h],"bytes":len(b)})
            except Exception as e:row["error"]=str(e)
            rows.append(row);print(json.dumps(row),flush=True)
          (out/"_report.json").write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-inovance-vmotors-2
          path: vmotors/
          retention-days: 1
