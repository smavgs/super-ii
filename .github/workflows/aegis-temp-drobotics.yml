name: Aegis D-Robotics exact recovery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-drobotics.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - name: Recover D-Robotics official board images
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,io,json,pathlib,re
          from urllib.parse import urljoin,urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          out=pathlib.Path("drobotics-exact");out.mkdir(exist_ok=True)
          targets=[
            (395,"RDK S100","https://d-robotics.github.io/rdk_doc/en/rdk_s/Quick_start/hardware_introduction/rdk_s100/"),
            (396,"RDK S600","https://d-robotics.github.io/rdk_doc/en/rdk_s/Quick_start/hardware_introduction/rdk_s600/"),
            (397,"RDK X3","https://d-robotics.github.io/rdk_doc/en/Quick_start/hardware_introduction/rdk_x3/"),
            (398,"RDK X3 Module","https://d-robotics.github.io/rdk_doc/en/Quick_start/hardware_introduction/rdk_x3/"),
            (399,"RDK X5","https://d-robotics.github.io/rdk_doc/en/Quick_start/hardware_introduction/rdk_x5/"),
          ]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          BAD=("logo","icon","favicon","banner","footer","header","wechat","qr","avatar","screenshot","display","config","terminal","diagram","pin","connector")
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def valid(b):
            try:
              im=Image.open(io.BytesIO(b));im.load()
              return len(b)>2500 and im.width>=220 and im.height>=150
            except:return False
          def ext(b,u):
            try:
              f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          def imgs(tag,base):
            a=[]
            for k in ("src","data-src","data-original"):
              v=tag.get(k)
              if isinstance(v,str) and v.strip():a.append(urljoin(base,v))
            return a
          def one(t):
            idx,name,page=t;n=norm(name)
            try:r=S.get(page,timeout=25);r.raise_for_status()
            except Exception as e:return {"index":idx,"name":name,"ok":False,"error":f"page:{type(e).__name__}:{e}"}
            soup=BeautifulSoup(r.text,"html.parser");text=soup.get_text(" ",strip=True)
            if n not in norm(text):return {"index":idx,"name":name,"ok":False,"error":"model absent from docs page"}
            cand=[]
            # Images in local section around exact model text.
            nodes=[]
            for s in soup.find_all(string=True):
              if n in norm(s):nodes.append(s)
            for node in nodes[:20]:
              p=node.parent
              for depth in range(8):
                if not p:break
                arr=[]
                for tag in p.find_all("img",limit=30):
                  arr+=imgs(tag,r.url)
                for u in arr:
                  lu=u.lower()
                  if any(x in lu for x in BAD):continue
                  score=5000-depth*300
                  if n in norm(u):score+=1200
                  if "overview" in lu or "mainboard" in lu or "hardware" in lu:score+=700
                  cand.append((score,u,"local-doc-section"))
                if arr and depth>=2:break
                p=p.parent
            # exact image alt/url
            for tag in soup.find_all("img"):
              lab=(tag.get("alt") or "")+" "+(tag.get("title") or "")
              for u in imgs(tag,r.url):
                lu=u.lower()
                if any(x in lu for x in BAD):continue
                score=0
                if n in norm(lab):score=6500
                elif n in norm(u):score=6000
                elif "mainboard_overview" in lu or "overview" in lu:score=2600
                if score:cand.append((score,u,lab or "exact"))
            uniq={}
            for s,u,w in cand:
              if u not in uniq or s>uniq[u][0]:uniq[u]=(s,w)
            best=None
            for score,u,why in sorted(((s,u,w) for u,(s,w) in uniq.items()),reverse=True)[:25]:
              try:
                ir=S.get(u,headers={"Referer":r.url},timeout=15);ir.raise_for_status();b=ir.content
                if not valid(b):continue
                im=Image.open(io.BytesIO(b));w,h=im.size;ratio=max(w/h,h/w)
                if ratio>5:continue
                s2=score*10000000+w*h+min(len(b),1000000)
                if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,why,score)
              except:pass
            if not best:return {"index":idx,"name":name,"ok":False,"error":f"no valid board image ({len(uniq)} candidates)"}
            _,b,u,w,h,why,score=best
            fn=f"{idx:03d} - D-Robotics - {name}{ext(b,u)}";(out/fn).write_bytes(b)
            return {"index":idx,"name":name,"ok":True,"file":fn,"page":r.url,"source":u,"dimensions":[w,h],"evidence":why,"score":score}
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
            for f in concurrent.futures.as_completed([ex.submit(one,t) for t in targets]):
              try:x=f.result()
              except Exception as e:x={"ok":False,"error":str(e)}
              results.append(x);print(json.dumps(x,ensure_ascii=False),flush=True)
          results.sort(key=lambda x:x.get("index",9999));ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":len(targets),"success":ok,"failed":len(targets)-ok,"results":results},ensure_ascii=False,indent=2))
          print(f"SUMMARY success={ok} failed={len(targets)-ok}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-drobotics-exact
          path: drobotics-exact/
          retention-days: 1
