name: Aegis LENFOR exact API recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-lenfor.yml"]
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests==2.32.5 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import json,re,pathlib,io,requests
          from urllib.parse import urljoin,urlparse
          from PIL import Image
          out=pathlib.Path("lenfor");out.mkdir(exist_ok=True)
          T=[(206,"LF-MERG34-15-35-RR"),(207,"LF-MFGF29-26-100-SR-DD"),(208,"LF-MSEC35-100-50-DR-DB"),(209,"LF-RH1X-1L")]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0","Accept":"application/json,image/*,*/*"})
          def n(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def good(b):
            try:im=Image.open(io.BytesIO(b));im.load();return len(b)>2500 and im.width>=160 and im.height>=120
            except:return False
          def ext(b,u):
            try:f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          r=S.get("https://api.lenfortech.com/api/products?with_details=true",timeout=25);r.raise_for_status();data=r.json()
          def walk(x, outlist):
            if isinstance(x,dict):
              outlist.append(x)
              for v in x.values():walk(v,outlist)
            elif isinstance(x,list):
              for v in x:walk(v,outlist)
          objs=[];walk(data,objs)
          results=[]
          for idx,name in T:
            nn=n(name); matches=[]
            for o in objs:
              text=" ".join(str(v) for v in o.values() if not isinstance(v,(dict,list)))
              if nn and nn in n(text):matches.append(o)
            urls=[]
            for o in matches:
              for k,v in o.items():
                if isinstance(v,str) and any(z in k.lower() for z in ("image","img","photo","picture","cover","thumbnail")):
                  if v.startswith(("http","/")):urls.append(v)
                elif isinstance(v,list):
                  for q in v:
                    if isinstance(q,str) and q.startswith(("http","/")) and re.search(r'\.(?:png|jpe?g|webp)(?:\?|$)',q,re.I):urls.append(q)
            # scan exact matched object's values for raw URLs
            for o in matches:
              for v in o.values():
                if isinstance(v,str):
                  urls += re.findall(r'https?://[^\s"\']+\.(?:png|jpe?g|webp)(?:\?[^\s"\']*)?',v,re.I)
            urls=list(dict.fromkeys(urls))
            best=None
            for u in urls[:20]:
              try:
                ir=S.get(u,timeout=15);ir.raise_for_status();b=ir.content
                if not good(b):continue
                im=Image.open(io.BytesIO(b));w,h=im.size
                if max(w/h,h/w)>5:continue
                score=w*h+len(b)
                if best is None or score>best[0]:best=(score,b,ir.url,w,h)
              except:pass
            if not best:
              x={"index":idx,"name":name,"ok":False,"matches":len(matches),"urls":urls[:10]};results.append(x);print(json.dumps(x),flush=True);continue
            _,b,u,w,h=best;fn=f"{idx:03d} - LENFOR - {name}{ext(b,u)}";(out/fn).write_bytes(b)
            x={"index":idx,"name":name,"ok":True,"file":fn,"source":u,"dimensions":[w,h],"matches":len(matches)};results.append(x);print(json.dumps(x),flush=True)
          ok=sum(x.get("ok",False) for x in results);(out/"_report.json").write_text(json.dumps({"success":ok,"results":results},indent=2));print("SUMMARY",ok)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: superii-lenfor, path: "lenfor/", retention-days: 1}
