name: Aegis DH-Robotics brochure candidates
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-dh-brochure.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests==2.32.5 pymupdf==1.26.5 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests,fitz,hashlib
          from PIL import Image
          out=pathlib.Path("dh-brochure");out.mkdir(exist_ok=True)
          u="https://en.dh-robotics.com/wp-content/uploads/2024/07/DH_Electric-Gripper-Brochure.pdf"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=60);r.raise_for_status()
          d=fitz.open(stream=r.content,filetype="pdf")
          targets=[(362,"PGC-140-50"),(363,"PGE-5-26"),(364,"PGEA-100-26"),(365,"PGHL-400-80"),(367,"PGSE-15-7")]
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def imgbytes(xref,smask):
            pix=fitz.Pixmap(d,xref)
            if smask:
              try:pix=fitz.Pixmap(pix,fitz.Pixmap(d,smask))
              except:pass
            if pix.n>4:pix=fitz.Pixmap(fitz.csRGB,pix)
            return pix.tobytes("png")
          rows=[]
          for idx,name in targets:
            n=norm(name);pages=[]
            for p in range(len(d)):
              try:t=d[p].get_text("text")
              except:t=""
              if n in norm(t):pages.append(p)
            row={"index":idx,"name":name,"pages":[p+1 for p in pages],"candidates":[]}
            pool=[]
            for p in pages[:4]:
              for im in d[p].get_images(full=True):
                try:
                  b=imgbytes(im[0],im[1]);pi=Image.open(io.BytesIO(b));w,h=pi.size
                  if len(b)<1800 or w<120 or h<100 or max(w/h,h/w)>6:continue
                  pool.append((w*h+len(b)*2,b,p,w,h))
                except:pass
            seen=set()
            for score,b,p,w,h in sorted(pool,reverse=True,key=lambda x:x[0]):
              hs=hashlib.sha256(b).hexdigest()
              if hs in seen:continue
              seen.add(hs);rank=len(row["candidates"])+1
              fn=f"{idx:03d} - DH-Robotics - {name} - candidate{rank}.png";(out/fn).write_bytes(b)
              row["candidates"].append({"file":fn,"page":p+1,"dimensions":[w,h],"bytes":len(b)})
              if rank>=4:break
            rows.append(row);print(json.dumps(row,ensure_ascii=False))
          (out/"_report.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-dh-brochure
          path: dh-brochure/
          retention-days: 1
