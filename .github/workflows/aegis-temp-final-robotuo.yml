name: Aegis final exact Robotuo media recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-final-robotuo.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from PIL import Image
          out=pathlib.Path("final-robotuo");out.mkdir(exist_ok=True)
          targets=[
            (471,"Percipio","TL430-E1"),
            (472,"Percipio","TL460-S1-E1"),
            (473,"Percipio","TM260-E1"),
            (476,"Percipio","TM421-E1"),
            (477,"Percipio","TM461-E2"),
            (507,"Unisunbot","XCP-040"),
          ]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          r=S.get("https://www.robotuo.com/robots/",timeout=30);r.raise_for_status()
          soup=BeautifulSoup(r.text,"html.parser")
          rows=[]
          for idx,maker,name in targets:
            row={"index":idx,"maker":maker,"name":name,"ok":False}
            # Exact alt match only.
            tag=soup.find("img",attrs={"alt":name})
            if tag is None:
              # exact article title fallback, but still require the image alt to equal model name
              for art in soup.select("article.seo-card"):
                h=art.find("h3")
                if h and h.get_text(" ",strip=True)==name:
                  t=art.find("img")
                  if t and (t.get("alt") or "")==name: tag=t;break
            if tag is None:
              row["error"]="exact catalogue image not found";rows.append(row);print(json.dumps(row));continue
            src=tag.get("src")
            if not src:
              row["error"]="exact image has no src";rows.append(row);print(json.dumps(row));continue
            u=urljoin(r.url,src)
            try:
              ir=S.get(u,headers={"Referer":r.url},timeout=25);ir.raise_for_status();b=ir.content
              im=Image.open(io.BytesIO(b));im.load()
              if len(b)<1000 or im.width<120 or im.height<90:raise ValueError("invalid-small-image")
              fmt=im.format.lower();ext=".jpg" if fmt=="jpeg" else "."+fmt
              fn=f"{idx:03d} - {maker} - {name}{ext}"
              (out/fn).write_bytes(b)
              row.update({"ok":True,"file":fn,"source":ir.url,"dimensions":[im.width,im.height],"bytes":len(b),"alt":tag.get("alt"),"evidence":"Robotuo exact model alt match"})
            except Exception as e:row["error"]=f"{type(e).__name__}:{e}"
            rows.append(row);print(json.dumps(row,ensure_ascii=False),flush=True)
          ok=sum(x.get("ok",False) for x in rows)
          (out/"_report.json").write_text(json.dumps({"requested":len(rows),"success":ok,"failed":len(rows)-ok,"results":rows},ensure_ascii=False,indent=2))
          print(f"SUMMARY success={ok} failed={len(rows)-ok}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-final-robotuo
          path: final-robotuo/
          retention-days: 1
