name: Aegis temporary DH-Robotics component images
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-dh-images.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - name: Recover exact DH-Robotics model images
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from PIL import Image
          root=pathlib.Path(".");out=root/"dh-images";out.mkdir(exist_ok=True)
          entries=[x for x in json.loads((root/".aegis-temp/component-images-missing-4.json").read_text())["missing"] if x.get("manufacturer")=="DH-Robotics Technology Co., Ltd."]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 Chrome/155 Safari/537.36","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def get(u,ref=None):
            h={"Referer":ref} if ref else {}
            r=S.get(u,headers=h,timeout=12,allow_redirects=True);r.raise_for_status();return r
          def valid(b):
            try:
              im=Image.open(io.BytesIO(b));im.load()
              if len(b)<1200 or im.width<120 or im.height<100:return None
              return im.width,im.height,im.format
            except:return None
          results=[]
          for it in entries:
            idx,rid,name=it["index"],it["id"],it["name"];mn=norm(name)
            rec=json.loads((root/"public/robot-library/records"/f"{rid}.json").read_text())
            urls=[x.get("url") for x in rec.get("resources") or [] if isinstance(x,dict) and x.get("url")]
            if rec.get("website"):urls.insert(0,rec["website"])
            urls=list(dict.fromkeys(urls))
            found=None
            for page in urls:
              try:r=get(page)
              except:continue
              soup=BeautifulSoup(r.text,"html.parser")
              cand=[]
              # Exact model table cell/row.
              for cell in soup.find_all(["td","th"]):
                if mn and mn in norm(cell.get_text(" ",strip=True)):
                  row=cell.find_parent("tr")
                  if row:
                    # Same row image first.
                    for im in row.find_all("img"):
                      u=im.get("src") or im.get("data-src") or im.get("data-original")
                      if u:cand.append((1000,urljoin(r.url,u),"same-row"))
                    # Product pages often put image row immediately below/above the model-name row.
                    for sib,boost in [(row.find_next_sibling("tr"),900),(row.find_previous_sibling("tr"),850)]:
                      if sib:
                        for im in sib.find_all("img"):
                          u=im.get("src") or im.get("data-src") or im.get("data-original")
                          if u:cand.append((boost,urljoin(r.url,u),"adjacent-row"))
              # Alt/src exact model.
              for im in soup.find_all("img"):
                u=im.get("src") or im.get("data-src") or im.get("data-original")
                if not u:continue
                full=urljoin(r.url,u);lab=norm((im.get("alt") or "")+" "+(im.get("title") or ""))
                if mn in lab or mn in norm(full):cand.append((1100,full,"model-alt-url"))
              # Match exact model text in raw HTML, pair with closest image URL.
              raw=r.text
              positions=[m.start() for m in re.finditer(re.escape(name),raw,re.I)]
              imgpat=re.compile(r'''(?:src|data-src|data-original)=["']([^"']+\.(?:png|jpe?g|webp)(?:\?[^"']*)?)["']''',re.I)
              for m in imgpat.finditer(raw):
                if positions:
                  dist=min(abs(m.start()-p) for p in positions)
                  if dist<3500:cand.append((800-dist/10,urljoin(r.url,m.group(1)),"near-model"))
              seen=set()
              for score,u,why in sorted(cand,reverse=True):
                if u in seen:continue
                seen.add(u)
                try:
                  ir=get(u,r.url);v=valid(ir.content)
                  if not v:continue
                  w,h,fmt=v
                  ext=".jpg" if (fmt or "").lower()=="jpeg" else "."+(fmt or "png").lower()
                  fn=f"{idx:03d} - DH-Robotics - {name}{ext}"
                  (out/fn).write_bytes(ir.content)
                  found={"index":idx,"name":name,"ok":True,"file":fn,"source":ir.url,"page":page,"dimensions":[w,h],"evidence":why}
                  break
                except:pass
              if found:break
            results.append(found or {"index":idx,"name":name,"ok":False,"error":"no-exact-model-image"})
          ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":len(entries),"success":ok,"failed":len(entries)-ok,"results":results},ensure_ascii=False,indent=2))
          print(json.dumps({"requested":len(entries),"success":ok,"failed":len(entries)-ok}))
          for x in results:print(json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-dh-images
          path: dh-images/
          if-no-files-found: error
          retention-days: 1
