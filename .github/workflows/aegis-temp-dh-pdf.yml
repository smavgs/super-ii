name: Aegis DH-Robotics official PDF recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-dh-pdf.yml"]
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: python -m pip install --quiet requests==2.32.5 pymupdf==1.26.5 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests,fitz
          from PIL import Image,ImageStat
          out=pathlib.Path("dh-pdf");out.mkdir(exist_ok=True)
          T=[(362,"PGC-140-50"),(363,"PGE-5-26"),(364,"PGEA-100-26"),(365,"PGHL-400-80"),(367,"PGSE-15-7")]
          urls=[
            "https://en.dh-robotics.com/wp-content/uploads/2024/07/Servo-Electric-Gripper-Catalog_DH-Robotics_EN.2407.pdf",
            "https://www.dh-robotics.com/wp-content/uploads/2022/03/DH-Robotics-Servo-Electric-Grippers-Product-Gallery-202203D.pdf"
          ]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0","Accept":"application/pdf,*/*"})
          docs=[]
          for u in urls:
            try:
              r=S.get(u,timeout=35);r.raise_for_status()
              if r.content.startswith(b"%PDF"):docs.append((u,fitz.open(stream=r.content,filetype="pdf")))
              else:print("NOTPDF",u,r.status_code,r.headers.get("content-type"),len(r.content))
            except Exception as e:print("PDFERR",u,e)
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def good(b):
            try:
              im=Image.open(io.BytesIO(b));im.load()
              return len(b)>2500 and im.width>=140 and im.height>=100
            except:return False
          def score_img(b,w,h):
            try:
              im=Image.open(io.BytesIO(b)).convert("RGB");im.thumbnail((128,128));st=ImageStat.Stat(im)
              return w*h+len(b)*5+sum(st.var)*100
            except:return w*h+len(b)
          results=[]
          for idx,name in T:
            nn=norm(name);best=None
            for u,d in docs:
              for pno in range(len(d)):
                try:text=d[pno].get_text("text")
                except:text=""
                if nn not in norm(text):continue
                for im in d[pno].get_images(full=True):
                  try:
                    z=d.extract_image(im[0]);b=z["image"];w=z.get("width",0);h=z.get("height",0)
                    if not good(b):continue
                    ratio=max(w/h,h/w)
                    if ratio>5:continue
                    sc=score_img(b,w,h)
                    if best is None or sc>best[0]:best=(sc,b,u,pno,w,h,z.get("ext","jpg"))
                  except:pass
            if not best:
              x={"index":idx,"name":name,"ok":False};results.append(x);print(json.dumps(x),flush=True);continue
            _,b,u,pno,w,h,e=best
            ex=".jpg" if e=="jpeg" else "."+e
            fn=f"{idx:03d} - DH-Robotics - {name}{ex}";(out/fn).write_bytes(b)
            x={"index":idx,"name":name,"ok":True,"file":fn,"source":u+f"#page={pno+1}","dimensions":[w,h]};results.append(x);print(json.dumps(x),flush=True)
          ok=sum(x.get("ok",False) for x in results);(out/"_report.json").write_text(json.dumps({"success":ok,"results":results},indent=2));print("SUMMARY",ok)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: superii-dh-pdf, path: "dh-pdf/", retention-days: 1}
