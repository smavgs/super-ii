name: TEMP component image export

on:
  push:
    branches:
      - tmp/component-image-export-20261028

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download one source image for each displayed component card
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, urllib.request, urllib.parse, mimetypes, time, csv

          root = pathlib.Path('.')
          index = json.loads((root/'src/content/robot-reference-index.json').read_text())
          comps = [x for x in index if x.get('record_type') == 'product' and x.get('category') == 'component']

          best = {}
          for c in comps:
              key = str(c.get('family_id') or '').strip() or c['id']
              cur = best.get(key)
              rank = lambda x: (0 if x.get('cover') else 1, str(x.get('name','')).lower(), str(x.get('id','')))
              if cur is None or rank(c) < rank(cur):
                  best[key] = c

          special = {
            '7db14f2d-e355-4d4c-aef2-1c8495fc6c57':0,
            'f939b660-25ed-4a19-baa5-0c9e22ab807b':1,
            '4c4bb7e0-8732-4837-9be7-cf5c4fc0b9dd':2,
            '14f49143-3f3e-4a3e-94ad-86ccd1ca22b9':3,
            'd88d2080-fdba-4078-9068-6ac64980767e':4,
            '188215cb-f5b2-4c7a-af1f-4db178a96841':5,
          }
          cards = list(best.values())
          cards.sort(key=lambda c: (
              0 if c.get('cover') else 1,
              special.get(c.get('id'), 6),
              str(c.get('name','')).lower(),
              str(c.get('id',''))
          ))

          out = root/'component-images'
          out.mkdir(exist_ok=True)
          results=[]

          def clean(s):
              s = re.sub(r'[\\/:*?"<>|]+', '-', str(s or '')).strip()
              s = re.sub(r'\s+', ' ', s)
              return s[:120].strip(' .-') or 'unknown'

          ext_by_ct = {
              'image/jpeg':'.jpg','image/jpg':'.jpg','image/png':'.png',
              'image/webp':'.webp','image/gif':'.gif','image/bmp':'.bmp',
              'image/tiff':'.tif','image/svg+xml':'.svg','image/avif':'.avif'
          }

          headers={'User-Agent':'Mozilla/5.0 (compatible; SuperIIImageArchive/1.0)','Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'}

          for idx, card in enumerate(cards, 1):
              rid=card['id']
              recp=root/'public/robot-library/records'/f'{rid}.json'
              try:
                  rec=json.loads(recp.read_text())
              except Exception as e:
                  results.append({'index':idx,'id':rid,'name':card.get('name',''),'manufacturer':card.get('company_name',''),'status':'record_error','url':'','file':'','error':str(e)})
                  continue

              candidates=[]
              for u in rec.get('source_images') or []:
                  if isinstance(u,str) and u.startswith('http'): candidates.append(u)
              for im in rec.get('images') or []:
                  if isinstance(im,dict):
                      u=im.get('url')
                      if isinstance(u,str) and u.startswith('http'): candidates.append(u)
                  elif isinstance(im,str) and im.startswith('http'):
                      candidates.append(im)
              seen=set(); candidates=[u for u in candidates if not (u in seen or seen.add(u))]

              maker=card.get('company_name') or ((rec.get('makers') or [{}])[0].get('name') if rec.get('makers') else '') or 'Unknown'
              family=card.get('family_name') or ''
              name=card.get('name') or rec.get('name') or rid
              stem=f"{idx:03d} - {clean(maker)}"
              if family: stem += f" - {clean(family)}"
              stem += f" - {clean(name)}"

              ok=False; last=''
              for u in candidates:
                  try:
                      req=urllib.request.Request(u,headers=headers)
                      with urllib.request.urlopen(req,timeout=30) as resp:
                          data=resp.read()
                          ct=(resp.headers.get_content_type() or '').lower()
                      if len(data)<500:
                          raise ValueError(f'too small: {len(data)} bytes')
                      ext=ext_by_ct.get(ct)
                      if not ext:
                          pext=pathlib.Path(urllib.parse.urlparse(u).path).suffix.lower()
                          ext=pext if pext in {'.jpg','.jpeg','.png','.webp','.gif','.bmp','.tif','.tiff','.svg','.avif'} else '.img'
                      if ext=='.jpeg': ext='.jpg'
                      fp=out/(stem+ext)
                      fp.write_bytes(data)
                      results.append({'index':idx,'id':rid,'name':name,'manufacturer':maker,'family':family,'status':'ok','url':u,'file':fp.name,'bytes':len(data),'content_type':ct})
                      ok=True
                      break
                  except Exception as e:
                      last=f'{type(e).__name__}: {e}'
                      time.sleep(0.15)
              if not ok:
                  results.append({'index':idx,'id':rid,'name':name,'manufacturer':maker,'family':family,'status':'failed','url':candidates[0] if candidates else '','file':'','error':last or 'no source image URL'})

          (out/'manifest.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          with (out/'manifest.csv').open('w',newline='',encoding='utf-8') as f:
              fields=sorted({k for r in results for k in r})
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(results)
          ok=sum(r['status']=='ok' for r in results)
          fail=len(results)-ok
          print(f'CARDS={len(cards)} OK={ok} FAILED={fail}')
          if len(cards)!=516:
              raise SystemExit(f'Expected 516 grouped cards, got {len(cards)}')
          PY

      - name: Upload component images artifact
        uses: actions/upload-artifact@v4
        with:
          name: superii-component-images
          path: component-images/
          if-no-files-found: error
          retention-days: 1
