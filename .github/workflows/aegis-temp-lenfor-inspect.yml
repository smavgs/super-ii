name: Aegis LENFOR source inspect
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-lenfor-inspect.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests==2.32.5
      - shell: bash
        run: |
          python3 - <<'PY'
          import json,requests,pathlib,re
          out=pathlib.Path("lenfor-inspect");out.mkdir(exist_ok=True)
          u="https://api.lenfortech.com/api/products?with_details=true"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=30);r.raise_for_status();obj=r.json()
          names=["LF-MERG34-15-35-RR","LF-MFGF29-26-100-SR-DD","LF-MSEC35-100-50-DR-DB","LF-RH1X-1L"]
          rows={}
          def walk(x,path="root"):
            if isinstance(x,dict):
              s=json.dumps(x,ensure_ascii=False)
              for n in names:
                if n in s and n not in rows: rows[n]={"path":path,"object":x}
              for k,v in x.items():walk(v,path+"."+str(k))
            elif isinstance(x,list):
              for i,v in enumerate(x):walk(v,path+f"[{i}]")
          walk(obj)
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          (out/"objects.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-lenfor-inspect
          path: lenfor-inspect/
          retention-days: 1
