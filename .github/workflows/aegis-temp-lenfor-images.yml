name: Aegis temporary LENFOR API image recovery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-lenfor-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --quiet requests==2.32.5 pillow==12.0.0
      - name: Recover exact LENFOR API images
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,warnings
          from urllib.parse import urljoin,urlparse
          import requests
          from PIL import Image
          warnings.filterwarnings("ignore")
          root=pathlib.Path(".");out=root/"lenfor-images";out.mkdir(exist_ok=True)
          entries=[x for x in json.loads((root/".aegis-temp/component-images-missing-4.json").read_text())["missing"] if x.get("manufacturer")=="LENFOR"]
          api="https://api.lenfortech.com/api/products?with_details=true"
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 Chrome/155 Safari/537.36","Accept":"application/json,*/*"})
          def norm(x):return re.sub(r"[^a-z0-9]+","",str(x or "").lower())
          def clean(s):s=re.sub(r'[\\/:*?"<>|]+','-',str(s or '')).strip();return re.sub(r'\s+',' ',s)[:100]
          def valid(b):
            try:
              im=Image.open(io.BytesIO(b));im.load()
              if len(b)<1200 or im.width<100 or im.height<80:return None
              return im.width,im.height,im.format
            except:return None
          def ext(u,fmt):
            e=pathlib.Path(urlparse(u).path).suffix.lower()
            if e in (".jpg",".jpeg",".png",".webp",".gif"):return ".jpg" if e==".jpeg" else e
            f=(fmt or "JPEG").lower();return ".jpg" if f=="jpeg" else "."+f
          r=S.get(api,timeout=30);r.raise_for_status();data=r.json()
          # collect all dictionaries in API tree
          dicts=[]
          def walk(x):
            if isinstance(x,dict):
              dicts.append(x)
              for v in x.values():walk(v)
            elif isinstance(x,list):
              for v in x:walk(v)
          walk(data)
          def text_of(d):
            vals=[]
            for k,v in d.items():
              if not isinstance(v,(dict,list)) and isinstance(v,(str,int,float)):vals.append(str(v))
            return " ".join(vals)
          def image_strings(x,key="",arr=None):
            arr=[] if arr is None else arr
            if isinstance(x,dict):
              for k,v in x.items():
                kl=str(k).lower()
                if isinstance(v,str):
                  if any(z in kl for z in ("image","img","photo","picture","pic","cover","thumb")) or re.search(r'\.(?:png|jpe?g|webp|gif)(?:\?|$)',v,re.I):
                    arr.append((kl,v))
                else:image_strings(v,kl,arr)
            elif isinstance(x,list):
              for v in x:image_strings(v,key,arr)
            return arr
          results=[]
          for it in entries:
            name=it["name"];nn=norm(name)
            matches=[]
            for d in dicts:
              txt=norm(text_of(d))
              if nn and nn in txt:matches.append(d)
            candidates=[]
            for d in matches:
              for k,u in image_strings(d):
                if not isinstance(u,str) or not u.strip():continue
                if u.startswith("//"):u="https:"+u
                elif u.startswith("/"):u=urljoin(api,u)
                elif not u.startswith("http"):u=urljoin(api,u)
                bonus=100 if any(z in k for z in ("image","img","photo","cover")) else 50
                if nn in norm(u):bonus+=50
                candidates.append((bonus,u))
            best=None
            for bonus,u in candidates:
              try:
                ir=S.get(u,headers={"Referer":"https://lenfortech.com/"},timeout=15);ir.raise_for_status()
                v=valid(ir.content)
                if not v:continue
                w,h,fmt=v;score=bonus+min(w*h/10000,100)+min(len(ir.content)/20000,40)
                if best is None or score>best[0]:best=(score,ir,w,h,fmt)
              except:pass
            if best:
              score,ir,w,h,fmt=best;fn=f"{it['index']:03d} - LENFOR - {clean(name)}{ext(ir.url,fmt)}";(out/fn).write_bytes(ir.content)
              results.append({"index":it["index"],"name":name,"ok":True,"file":fn,"source":ir.url,"dimensions":[w,h],"score":round(score,2),"matches":len(matches),"candidate_count":len(candidates)})
            else:
              probe=[]
              for bonus,u in candidates[:8]:
                try:
                  pr=S.get(u,headers={"Referer":"https://lenfortech.com/"},timeout=10,allow_redirects=True)
                  probe.append({"url":u,"status":pr.status_code,"content_type":pr.headers.get("Content-Type",""),"final":pr.url,"bytes":len(pr.content)})
                except Exception as e:probe.append({"url":u,"error":type(e).__name__+":"+str(e)})
              results.append({"index":it["index"],"name":name,"ok":False,"matches":len(matches),"candidate_count":len(candidates),"candidate_urls":[u for _,u in candidates[:8]],"probe":probe})
          ok=sum(bool(x.get("ok")) for x in results)
          (out/"_lenfor-report.json").write_text(json.dumps({"requested":len(entries),"success":ok,"failed":len(entries)-ok,"results":results},ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2));print(f"SUMMARY success={ok} failed={len(entries)-ok}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-lenfor-images
          path: lenfor-images/
          if-no-files-found: error
          retention-days: 1
