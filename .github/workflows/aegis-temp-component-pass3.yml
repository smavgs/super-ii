name: Aegis temporary component recovery pass 3
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-component-pass3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pymupdf==1.26.5
      - name: Recover remaining exact originals by model-local context
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, pathlib, re, warnings
          from urllib.parse import urljoin,urlparse
          import requests, fitz
          from bs4 import BeautifulSoup, NavigableString
          warnings.filterwarnings("ignore")

          root=pathlib.Path("."); out=root/"component-pass3"; out.mkdir(exist_ok=True)
          entries=json.loads((root/".aegis-temp/component-images-missing-3.json").read_text())["missing"]
          aliases={"Jiangsu DINGS' Intelligent Control Technology Co., Ltd.":"DINGS","DH-Robotics Technology Co., Ltd.":"DH-Robotics","Nanchang Kude Intelligent Technology Co., Ltd.":"CubeMars","Mech-Mind Robotics":"Mech-Mind"}
          BAD=("logo","icon","favicon","wechat","weixin","qr","avatar","loading","placeholder","sprite","footer","header","arrow","menu","search","language","facebook","linkedin","youtube")
          IMGEXT=(".jpg",".jpeg",".png",".webp",".gif",".bmp")
          S=requests.Session(); S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"text/html,application/xhtml+xml,application/json,image/avif,image/webp,image/*,*/*;q=0.8","Accept-Language":"en-US,en;q=0.8,zh-CN;q=0.6"})

          def norm(x): return re.sub(r"[^a-z0-9]+","",str(x or "").lower())
          def clean(s):
            s=re.sub(r'[\\/:*?"<>|]+','-',str(s or '')).strip(); s=re.sub(r'\s+',' ',s)
            return s[:100].strip(' .-') or "Unknown"
          def fname(rec,idx,ext):
            maker=((rec.get("makers") or [{}])[0].get("name") or "Unknown"); maker=aliases.get(maker,maker)
            name=rec.get("name") or rec.get("model") or rec.get("id"); fam=((rec.get("family") or {}).get("name") or "")
            p=[f"{idx:03d}",clean(maker)]
            if fam and norm(fam)!=norm(name):p.append(clean(fam))
            p.append(clean(name)); return " - ".join(p)+ext
          def okimg(b,ct=""):
            if not b or len(b)<900:return False
            return b.startswith(b"\xff\xd8\xff") or b.startswith(b"\x89PNG\r\n\x1a\n") or (len(b)>=12 and b[:4]==b"RIFF" and b[8:12]==b"WEBP") or b.startswith((b"GIF87a",b"GIF89a"))
          def ext(u,ct,b):
            e=pathlib.Path(urlparse(u).path).suffix.lower()
            if e in IMGEXT:return ".jpg" if e==".jpeg" else e
            ct=ct.lower()
            if "png" in ct:return ".png"
            if "webp" in ct:return ".webp"
            if "gif" in ct:return ".gif"
            return ".jpg"
          def get(u,ref=None,t=18):
            h={"Referer":ref} if ref else {}
            try:r=S.get(u,headers=h,timeout=t,allow_redirects=True)
            except requests.exceptions.SSLError:r=S.get(u,headers=h,timeout=t,allow_redirects=True,verify=False)
            r.raise_for_status(); return r
          def urls(rec):
            a=[]
            for u in [rec.get("website"),(rec.get("seed") or {}).get("source_url")]:
              if isinstance(u,str) and u.startswith("http") and "robots.com/" not in u:a.append(u)
            for x in rec.get("resources") or []:
              u=x.get("url") if isinstance(x,dict) else None
              if isinstance(u,str) and u.startswith("http") and "robots.com/" not in u:a.append(u)
            return list(dict.fromkeys(a))
          def save(rec,idx,b,u,ct,why,score):
            if not okimg(b,ct):raise ValueError("bad-image")
            fn=fname(rec,idx,ext(u,ct,b)); (out/fn).write_bytes(b)
            return {"ok":True,"file":fn,"source":u,"bytes":len(b),"evidence":why,"score":score}

          def all_image_urls(tag,base):
            res=[]
            if not hasattr(tag,"attrs"):return res
            for a in ("src","data-src","data-original","data-lazy-src","data-url","poster"):
              v=tag.get(a)
              if isinstance(v,str) and v.strip():res.append(v.strip())
            for a in ("srcset","data-srcset"):
              v=tag.get(a)
              if isinstance(v,str):
                res += [x.strip().split()[0] for x in v.split(",") if x.strip()]
            style=tag.get("style") or ""
            res += [part.split(")",1)[0].strip(" \'\\\"") for part in style.split("url(")[1:]]
            href=tag.get("href")
            if isinstance(href,str) and href.lower().split("?")[0].endswith(IMGEXT):res.append(href)
            return [urljoin(base,u.replace("\\/","/")) for u in res]

          def json_images(obj,modeln,found,hit=False):
            if isinstance(obj,dict):
              serial=norm(" ".join(str(v) for v in obj.values() if not isinstance(v,(dict,list))))
              here=hit or (modeln and modeln in serial)
              for k,v in obj.items():
                kl=str(k).lower()
                if isinstance(v,str) and any(z in kl for z in ("image","img","photo","pic","cover","thumb","url")) and v.startswith(("http","/")):
                  if here or modeln in norm(v):found.append((180 if here else 150,v,"json-exact-object"))
                elif isinstance(v,(dict,list)):json_images(v,modeln,found,here)
            elif isinstance(obj,list):
              for v in obj:json_images(v,modeln,found,hit)

          def pdf(rec,idx,r,u,modeln):
            try:d=fitz.open(stream=r.content,filetype="pdf")
            except:return None
            pages=[]
            for p in range(len(d)):
              try:t=d[p].get_text("text")
              except:t=""
              if modeln and modeln in norm(t):pages.append(p)
            if not pages and modeln in norm(pathlib.Path(urlparse(u).path).stem):pages=[0]
            best=None
            for p in pages[:10]:
              pg=d[p]
              for im in pg.get_images(full=True):
                try:
                  z=d.extract_image(im[0]); b=z["image"]; w=z.get("width",0);h=z.get("height",0)
                  if len(b)<2200 or w<100 or h<100:continue
                  score=w*h
                  if best is None or score>best[0]:best=(score,b,z.get("ext","jpg"),p,w,h)
                except:pass
            if best:
              _,b,e,p,w,h=best; fn=fname(rec,idx,"."+("jpg" if e=="jpeg" else e));(out/fn).write_bytes(b)
              return {"ok":True,"file":fn,"source":u+f"#page={p+1}","bytes":len(b),"evidence":"pdf-model-page-image","score":170,"dimensions":[w,h]}
            return None

          def htmlc(text,base,name,modeln):
            soup=BeautifulSoup(text,"html.parser")
            bodytext=soup.get_text(" ",strip=True)
            page_has=bool(modeln and modeln in norm(bodytext))
            detail=bool(re.search(r'/(?:product(?:_show|s)?|detail|mrt|ltc|ltfd|grippermodule|compensation|products?)/',urlparse(base).path,re.I) or "product_details" in base)
            c=[]
            # exact text node -> local DOM image candidates
            search_terms=[name]
            model_tokens=[t for t in re.findall(r"[A-Za-z0-9][A-Za-z0-9+_.-]{2,}",name) if len(norm(t))>=4]
            nodes=[]
            for s in soup.find_all(string=True):
              tx=str(s)
              nt=norm(tx)
              if modeln and modeln in nt:nodes.append(s)
              elif model_tokens and all(norm(t) in nt for t in model_tokens[:2]):nodes.append(s)
            for node in nodes[:20]:
              parent=node.parent
              for depth in range(5):
                if parent is None:break
                imgs=[]
                for tag in parent.find_all(["img","source","a","video"],limit=30):
                  imgs += all_image_urls(tag,base)
                styleurls=[part.split(")",1)[0].strip(" \'\\\"") for part in str(parent).split("url(")[1:]]
                imgs += [urljoin(base,u) for u in styleurls]
                for u in imgs:
                  if any(b in norm(u) for b in BAD):continue
                  c.append((190-depth*8,u,"same-model-dom-block"))
                if imgs:break
                parent=parent.parent
            # model in script/raw context around image URL
            imgpat=re.compile(r'''(?:"|')([^"'<>\\ ]+\.(?:png|jpe?g|webp|gif)(?:\?[^"'<>\\ ]*)?)(?:"|')''',re.I)
            raw=text
            for m in imgpat.finditer(raw):
              u=urljoin(base,m.group(1).replace("\\/","/")); un=norm(u)
              if any(b in un for b in BAD):continue
              a=max(0,m.start()-5000);b=min(len(raw),m.end()+5000)
              win=norm(raw[a:b])
              if modeln and modeln in win:c.append((175,u,"raw-window-model"))
              elif model_tokens and all(norm(t) in win for t in model_tokens[:2]):c.append((160,u,"raw-window-model-tokens"))
              elif modeln and modeln in un:c.append((185,u,"url-model"))
            # all DOM images with alt/title
            for tag in soup.find_all(["img","source","video"]):
              lab=norm((tag.get("alt") or "")+" "+(tag.get("title") or ""))
              for u in all_image_urls(tag,base):
                if any(b in norm(u) for b in BAD):continue
                if modeln and modeln in lab:c.append((195,u,"alt-model"))
                elif modeln and modeln in norm(u):c.append((188,u,"url-model"))
            # meta image if detail page contains model
            if page_has and detail:
              for tag in soup.find_all("meta"):
                key=(tag.get("property") or tag.get("name") or "").lower();u=tag.get("content")
                if u and key in ("og:image","og:image:url","twitter:image","twitter:image:src"):
                  c.append((145,urljoin(base,u),"detail-page-meta"))
              # fallback significant images on exact source detail page
              if not c:
                for tag in soup.find_all("img"):
                  lab=norm((tag.get("alt") or "")+" "+(tag.get("title") or ""))
                  for u in all_image_urls(tag,base):
                    un=norm(u)
                    if any(b in un for b in BAD):continue
                    if any(k in un for k in ("product","upload","images","img","goods")):
                      c.append((125,u,"detail-page-main-image"))
            # JS object image strings if model appears in script
            for sc in soup.find_all("script"):
              st=sc.string or sc.get_text() or ""
              if modeln and modeln in norm(st):
                for m in imgpat.finditer(st):
                  u=urljoin(base,m.group(1).replace("\\/","/"))
                  if not any(b in norm(u) for b in BAD):c.append((168,u,"script-model-image"))
            uniq={}
            for s,u,w in c:
              if u not in uniq or s>uniq[u][0]:uniq[u]=(s,w)
            return sorted(((s,u,w) for u,(s,w) in uniq.items()),reverse=True),page_has,detail

          def one(it):
            idx,rid=it["index"],it["id"]
            try:rec=json.loads((root/"public/robot-library/records"/f"{rid}.json").read_text())
            except Exception as e:return {"index":idx,"ok":False,"error":f"record:{e}"}
            name=rec.get("name") or rec.get("model") or rid; modeln=norm(name); errs=[]
            us=urls(rec)
            if not us:return {"index":idx,"name":name,"ok":False,"error":"no-official-url"}
            for u in us[:6]:
              try:r=get(u,t=20)
              except Exception as e:errs.append(f"{u}:GET:{type(e).__name__}");continue
              ct=(r.headers.get("Content-Type") or "").lower(); final=r.url
              if "image/" in ct or final.lower().split("?")[0].endswith(IMGEXT):
                try:return {"index":idx,"name":name,"page":u,**save(rec,idx,r.content,final,ct,"direct-official-image",200)}
                except Exception as e:errs.append(f"{u}:direct:{e}")
              if "pdf" in ct or final.lower().split("?")[0].endswith(".pdf"):
                z=pdf(rec,idx,r,final,modeln)
                if z:return {"index":idx,"name":name,"page":u,**z}
                errs.append(f"{u}:pdf-no-image");continue
              if "json" in ct or "/api/" in final or final.lower().endswith(".json"):
                try:
                  obj=r.json();found=[];json_images(obj,modeln,found,False)
                  for sc,iu,why in sorted(found,reverse=True)[:15]:
                    try:
                      ir=get(urljoin(final,iu),ref=final,t=14)
                      return {"index":idx,"name":name,"page":u,**save(rec,idx,ir.content,ir.url,ir.headers.get("Content-Type",""),why,sc)}
                    except Exception as e:errs.append(f"jsonimg:{type(e).__name__}")
                except Exception as e:errs.append(f"{u}:json:{type(e).__name__}")
              cand,page_has,detail=htmlc(r.text,final,name,modeln)
              for sc,iu,why in cand[:18]:
                if sc<120:continue
                try:
                  ir=get(iu,ref=final,t=14)
                  return {"index":idx,"name":name,"page":u,**save(rec,idx,ir.content,ir.url,ir.headers.get("Content-Type",""),why,sc)}
                except Exception as e:errs.append(f"img:{type(e).__name__}")
              errs.append(f"{u}:none:{len(cand)} has={page_has} detail={detail}")
            return {"index":idx,"name":name,"ok":False,"error":" | ".join(errs)[-3500:]}

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=28) as ex:
            fs=[ex.submit(one,x) for x in entries]
            for n,f in enumerate(concurrent.futures.as_completed(fs),1):
              try:r=f.result()
              except Exception as e:r={"ok":False,"error":f"worker:{e}"}
              results.append(r);print(json.dumps(r,ensure_ascii=False),flush=True)
              if n%25==0:print(f"PROGRESS {n}/{len(entries)}",flush=True)
          results.sort(key=lambda x:x.get("index",9999));ok=sum(bool(x.get("ok")) for x in results)
          (out/"_pass3-report.json").write_text(json.dumps({"requested":len(entries),"success":ok,"failed":len(entries)-ok,"results":results},ensure_ascii=False,indent=2))
          print(f"SUMMARY success={ok} failed={len(entries)-ok}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-component-pass3
          path: component-pass3/
          if-no-files-found: error
          retention-days: 1
