name: temp component image fetch
on:
  push:
    branches:
      - aegis-temp-component-image-fetch
    paths:
      - tools/temp-fetch-component-images.py
      - .github/workflows/temp-component-images.yml
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pillow
      - run: python tools/temp-fetch-component-images.py --limit 1
      - uses: actions/upload-artifact@v4
        with:
          name: component-image-test
          path: tmp-component-images/
          if-no-files-found: error
          retention-days: 1
