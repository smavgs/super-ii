name: Rust security audit

on:
  pull_request:
    paths:
      - rust/Cargo.toml
      - rust/Cargo.lock
      - .github/workflows/rust-audit.yml
  push:
    branches: [main]
    paths:
      - rust/Cargo.toml
      - rust/Cargo.lock
      - .github/workflows/rust-audit.yml
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    name: rustsec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified cargo-audit 0.22.2
        env:
          CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-audit.tgz"
          release_dir="cargo-audit-x86_64-unknown-linux-gnu-v0.22.2"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          echo "$CARGO_AUDIT_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" \
            --strip-components=1 "$release_dir/cargo-audit"
          install -m 0755 "$RUNNER_TEMP/cargo-audit" "$RUNNER_TEMP/bin-cargo-audit"
          "$RUNNER_TEMP/bin-cargo-audit" --version
      - name: Audit locked Rust dependencies against RustSec
        run: |
          "$RUNNER_TEMP/bin-cargo-audit" audit --file rust/Cargo.lock --deny warnings
