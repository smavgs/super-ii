name: Aegis Percipio exact datasheet image recovery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-percipio.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --quiet requests==2.32.5 pymupdf==1.26.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - name: Extract exact Percipio originals
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,io,json,pathlib,re
          from urllib.parse import urljoin,urlparse
          import requests,fitz
          from bs4 import BeautifulSoup
          from PIL import Image
          root=pathlib.Path(".");out=root/"percipio-exact";out.mkdir(exist_ok=True)
          wanted={"Percipio"}
          manifest=json.loads((root/".aegis-temp/component-images-missing-5.json").read_text())["missing"]
          entries=[x for x in manifest if x.get("manufacturer") in wanted]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0","Accept":"*/*"})
          def clean(s):
            s=re.sub(r'[\\/:*?"<>|]+','-',str(s or '')).strip();s=re.sub(r'\s+',' ',s)
            return s[:100].strip(' .-') or "Unknown"
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def good(b):
            try:
              im=Image.open(io.BytesIO(b));im.load();return len(b)>2500 and im.width>=150 and im.height>=100
            except:return False
          def ext_from(b):
            try:
              f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          def choose_pdf(rec,idx,name,url):
            r=S.get(url,timeout=25);r.raise_for_status()
            d=fitz.open(stream=r.content,filetype="pdf")
            modeln=norm(name)
            pages=[]
            for p in range(len(d)):
              try:t=d[p].get_text("text")
              except:t=""
              if modeln and modeln in norm(t):pages.append(p)
            if not pages:pages=[0]
            best=None
            for p in pages[:4]:
              for im in d[p].get_images(full=True):
                try:
                  z=d.extract_image(im[0]);b=z["image"];w=z.get("width",0);h=z.get("height",0)
                  if not good(b):continue
                  ratio=max(w/h,h/w)
                  if ratio>5:continue
                  area=w*h
                  score=area + min(len(b),500000)*3
                  if best is None or score>best[0]:best=(score,b,p,w,h)
                except:pass
            if not best:return None
            _,b,p,w,h=best
            fn=f"{idx:03d} - Percipio - {clean(name)}{ext_from(b)}"
            (out/fn).write_bytes(b)
            return {"index":idx,"name":name,"ok":True,"file":fn,"source":url+f"#page={p+1}","dimensions":[w,h],"evidence":"official-datasheet-embedded-image"}
          def choose_html(rec,idx,name,url):
            r=S.get(url,timeout=25);r.raise_for_status();s=BeautifulSoup(r.text,"html.parser")
            # exact product page: prefer images whose alt/url contains model
            modeln=norm(name);cand=[]
            for tag in s.find_all("img"):
              src=tag.get("src") or tag.get("data-src") or tag.get("data-original")
              if not src:continue
              u=urljoin(r.url,src);lab=norm((tag.get("alt") or "")+" "+u)
              score=100 if modeln in lab else 0
              if any(x in u.lower() for x in ("logo","icon","banner","qr","wechat")):continue
              cand.append((score,u))
            cand.sort(reverse=True)
            best=None
            for score,u in cand[:20]:
              try:
                ir=S.get(u,headers={"Referer":r.url},timeout=15);ir.raise_for_status();b=ir.content
                if not good(b):continue
                im=Image.open(io.BytesIO(b));w,h=im.size;area=w*h
                s2=score*1000000+area
                if best is None or s2>best[0]:best=(s2,b,ir.url,w,h)
              except:pass
            if not best:return None
            _,b,u,w,h=best
            fn=f"{idx:03d} - Percipio - {clean(name)}{ext_from(b)}";(out/fn).write_bytes(b)
            return {"index":idx,"name":name,"ok":True,"file":fn,"source":u,"dimensions":[w,h],"evidence":"official-exact-product-page-image"}
          def one(it):
            idx,rid=it["index"],it["id"];rec=json.loads((root/"public/robot-library/records"/f"{rid}.json").read_text())
            name=rec.get("name") or it.get("name") or rid
            urls=[]
            if rec.get("website"):urls.append(rec["website"])
            for x in rec.get("resources") or []:
              if isinstance(x,dict) and x.get("url"):urls.append(x["url"])
            errs=[]
            for u in urls:
              try:
                if u.lower().split("?")[0].endswith(".pdf"):
                  z=choose_pdf(rec,idx,name,u)
                else:z=choose_html(rec,idx,name,u)
                if z:return z
              except Exception as e:errs.append(f"{type(e).__name__}:{e}")
            return {"index":idx,"name":name,"ok":False,"error":" | ".join(errs)}
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            for f in concurrent.futures.as_completed([ex.submit(one,x) for x in entries]):
              try:r=f.result()
              except Exception as e:r={"ok":False,"error":str(e)}
              results.append(r);print(json.dumps(r,ensure_ascii=False),flush=True)
          results.sort(key=lambda x:x.get("index",9999));ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":len(entries),"success":ok,"failed":len(entries)-ok,"results":results},ensure_ascii=False,indent=2))
          print(f"SUMMARY success={ok} failed={len(entries)-ok}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-percipio-exact
          path: percipio-exact/
          retention-days: 1
