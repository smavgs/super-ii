name: Aegis frontend asset source dump
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-source-dump.yml"]
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests==2.32.5
      - shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,requests,json
          out=pathlib.Path("source-dump");out.mkdir(exist_ok=True)
          urls={
            "linksoon.js":"https://lssd-sz.com/_nuxt/Ccrh0RXe.js",
            "agiletact.js":"https://www.agiletact.com/assets/index-BVwTaxXE.js",
          }
          rows={}
          for fn,u in urls.items():
            try:
              r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=30);r.raise_for_status()
              (out/fn).write_bytes(r.content)
              rows[fn]={"ok":True,"bytes":len(r.content),"ct":r.headers.get("content-type"),"url":r.url}
            except Exception as e:rows[fn]={"ok":False,"error":repr(e)}
          (out/"_report.json").write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-source-dump
          path: source-dump/
          retention-days: 1
