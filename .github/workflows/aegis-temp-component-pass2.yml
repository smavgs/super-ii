name: Aegis temporary component recovery pass 2
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-component-pass2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install recovery parsers
        run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pymupdf==1.26.5
      - name: Recover remaining exact official images
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, io, json, pathlib, re, time, warnings
          from urllib.parse import urljoin, urlparse, quote, unquote
          import requests
          from bs4 import BeautifulSoup
          import fitz
          warnings.filterwarnings("ignore")

          root=pathlib.Path(".")
          out=root/"component-pass2"
          out.mkdir(exist_ok=True)
          entries=json.loads((root/".aegis-temp/component-images-missing-2.json").read_text())["missing"]

          aliases={
            "Jiangsu DINGS' Intelligent Control Technology Co., Ltd.":"DINGS",
            "DH-Robotics Technology Co., Ltd.":"DH-Robotics",
            "Nanchang Kude Intelligent Technology Co., Ltd.":"CubeMars",
            "Mech-Mind Robotics":"Mech-Mind",
          }
          BAD=("logo","banner","icon","favicon","wechat","weixin","qr","avatar","loading","placeholder","sprite","footer","header","arrow","menu","search","language","close","facebook","linkedin","youtube")
          IMG_EXT={".jpg",".jpeg",".png",".webp",".gif",".bmp",".tif",".tiff"}

          sess=requests.Session()
          sess.headers.update({
            "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
            "Accept":"text/html,application/xhtml+xml,application/json,image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
            "Accept-Language":"en-US,en;q=0.8,zh-CN;q=0.5",
          })

          def norm(s): return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def clean(s):
            s=re.sub(r'[\\/:*?"<>|]+','-',str(s or '')).strip()
            s=re.sub(r'\s+',' ',s)
            return s[:100].strip(' .-') or "Unknown"
          def image_ok(data,ctype=""):
            if not data or len(data)<1000: return False
            if data.startswith(b"\xff\xd8\xff"): return True
            if data.startswith(b"\x89PNG\r\n\x1a\n"): return True
            if len(data)>=12 and data[:4]==b"RIFF" and data[8:12]==b"WEBP": return True
            if data.startswith((b"GIF87a",b"GIF89a")): return True
            if data[:2] in (b"BM",b"II",b"MM"): return True
            h=data[:512].lstrip().lower()
            return b"<svg" in h and "svg" in ctype.lower()
          def ext_for(url,ctype,data):
            p=pathlib.Path(urlparse(url).path).suffix.lower()
            if p in IMG_EXT: return ".jpg" if p==".jpeg" else p
            c=(ctype or "").lower()
            if "jpeg" in c:return ".jpg"
            if "png" in c:return ".png"
            if "webp" in c:return ".webp"
            if "gif" in c:return ".gif"
            if "bmp" in c:return ".bmp"
            if data.startswith(b"\xff\xd8\xff"):return ".jpg"
            if data.startswith(b"\x89PNG"):return ".png"
            if len(data)>=12 and data[:4]==b"RIFF" and data[8:12]==b"WEBP":return ".webp"
            return ".jpg"
          def rec_urls(rec):
            arr=[]
            for u in [rec.get("website"),(rec.get("seed") or {}).get("source_url")]:
              if isinstance(u,str) and u.startswith("http"): arr.append(u)
            for x in rec.get("resources") or []:
              u=x.get("url") if isinstance(x,dict) else None
              if isinstance(u,str) and u.startswith("http"): arr.append(u)
            outu=[]
            for u in arr:
              if "robots.com/" in u: continue
              if u not in outu: outu.append(u)
            return outu
          def filename(rec,idx,ext):
            maker=((rec.get("makers") or [{}])[0].get("name") or "Unknown")
            maker=aliases.get(maker,maker)
            fam=((rec.get("family") or {}).get("name") or "")
            name=rec.get("name") or rec.get("model") or rec.get("id")
            parts=[f"{idx:03d}",clean(maker)]
            if fam and norm(fam)!=norm(name): parts.append(clean(fam))
            parts.append(clean(name))
            return " - ".join(parts)+ext
          def save_img(rec,idx,data,url,ctype,evidence,score):
            if not image_ok(data,ctype): raise ValueError("invalid image bytes")
            ext=ext_for(url,ctype,data)
            fn=filename(rec,idx,ext)
            (out/fn).write_bytes(data)
            return {"ok":True,"file":fn,"bytes":len(data),"source":url,"evidence":evidence,"score":score}

          def get(u,referer=None,timeout=16):
            h={}
            if referer: h["Referer"]=referer
            try:
              r=sess.get(u,headers=h,timeout=timeout,allow_redirects=True,verify=True)
            except requests.exceptions.SSLError:
              r=sess.get(u,headers=h,timeout=timeout,allow_redirects=True,verify=False)
            r.raise_for_status()
            return r

          def walk_json(obj, modeln, found, context=False):
            if isinstance(obj,dict):
              vals=" ".join(str(v) for k,v in obj.items() if k.lower() in ("name","model","title","sku","product_name","productname") and not isinstance(v,(dict,list)))
              here=context or (modeln and modeln in norm(vals))
              for k,v in obj.items():
                kl=k.lower()
                if isinstance(v,str) and any(t in kl for t in ("image","img","photo","picture","pic","cover","thumb")):
                  if v.startswith(("http","/")) and (here or modeln in norm(v)):
                    found.append((145 if here else 120,v,"json"))
                elif isinstance(v,(dict,list)):
                  walk_json(v,modeln,found,here)
            elif isinstance(obj,list):
              for v in obj: walk_json(v,modeln,found,context)

          def pdf_candidate(rec,idx,r,url,modeln):
            data=r.content
            try: doc=fitz.open(stream=data,filetype="pdf")
            except Exception as e: return None,f"pdf-open:{e}"
            hits=[]
            for pno in range(len(doc)):
              try: txt=doc[pno].get_text("text")
              except: txt=""
              nt=norm(txt)
              if modeln and modeln in nt: hits.append(pno)
            if not hits:
              stem=norm(pathlib.Path(urlparse(url).path).stem)
              if modeln and modeln in stem: hits=[0]
            best=None
            for pno in hits[:8]:
              page=doc[pno]
              for im in page.get_images(full=True):
                xref=im[0]
                try:
                  info=doc.extract_image(xref); b=info["image"]; ext=info.get("ext","jpg")
                  w,h=info.get("width",0),info.get("height",0)
                  if len(b)<2500 or w<120 or h<120: continue
                  area=w*h
                  # avoid full-page scanned sheets unless nothing else
                  score=150 + min(area/1_000_000,20)
                  if best is None or score>best[0]: best=(score,b,ext,pno,w,h)
                except: pass
            if best:
              score,b,ext,pno,w,h=best
              fn=filename(rec,idx,"."+("jpg" if ext=="jpeg" else ext))
              (out/fn).write_bytes(b)
              return {"ok":True,"file":fn,"bytes":len(b),"source":url+f"#page={pno+1}","evidence":"pdf-embedded-image","score":score,"dimensions":[w,h]},None
            return None,"pdf-no-matched-embedded-image"

          def html_candidates(text,base,modeln,title):
            c=[]
            soup=BeautifulSoup(text,"html.parser")
            title_text=(soup.title.get_text(" ",strip=True) if soup.title else title) or ""
            headers=" ".join(x.get_text(" ",strip=True) for x in soup.find_all(["h1","h2"])[:8])
            page_specific=bool(modeln and (modeln in norm(title_text) or modeln in norm(headers)))
            raw_lower=text.lower()
            model_positions=[]
            # search several normalized-ish literal variants
            terms=[]
            for t in [modeln]:
              if t and len(t)>=3: terms.append(t)
            # Use literal name words too
            # model_positions based on stripped alnum window is expensive; use raw occurrence of salient token
            for term in re.findall(r"[A-Za-z0-9][A-Za-z0-9+_.-]{2,}", title_text+" "+headers):
              if norm(term)==modeln or (modeln and len(norm(term))>=4 and norm(term) in modeln):
                for m in re.finditer(re.escape(term.lower()),raw_lower):
                  model_positions.append(m.start())
            for tag in soup.find_all("img"):
              vals=[]
              for a in ("src","data-src","data-original","data-lazy-src","data-url"):
                v=tag.get(a)
                if v: vals.append(v)
              ss=tag.get("srcset")
              if ss:
                vals.extend(x.strip().split()[0] for x in ss.split(",") if x.strip())
              label=" ".join([(tag.get("alt") or ""),(tag.get("title") or "")])
              ln=norm(label)
              for u in vals:
                if not isinstance(u,str): continue
                full=urljoin(base,u)
                un=norm(full)
                if any(b in un for b in BAD): continue
                score=0
                why="img"
                if modeln and modeln in ln: score=175; why="img-alt-model"
                elif modeln and len(modeln)>=4 and modeln in un: score=165; why="img-url-model"
                else:
                  pos=text.find(u)
                  if pos<0: pos=text.find(u.replace("&","&amp;"))
                  if model_positions and pos>=0:
                    dist=min(abs(pos-p) for p in model_positions)
                    if dist<1200: score=155-dist/100
                    elif dist<3500: score=135-dist/300
                    elif dist<7000: score=112-dist/700
                    if score: why="img-near-model"
                  if not score and page_specific:
                    w=int(re.sub(r"\D","",tag.get("width") or "0") or 0)
                    h=int(re.sub(r"\D","",tag.get("height") or "0") or 0)
                    if (w>=250 and h>=180) or ("product" in un or "upload" in un):
                      score=88; why="page-specific-product-img"
                if score: c.append((score,full,why))
            # meta / link
            for tag in soup.find_all("meta"):
              key=(tag.get("property") or tag.get("name") or "").lower()
              u=tag.get("content")
              if u and key in ("og:image","og:image:url","twitter:image","twitter:image:src"):
                c.append((105 if page_specific else 55,urljoin(base,u),"meta"))
            # CSS and raw JS URLs around model names
            imgpat=re.compile(r'''(?:"|')([^"'<>\\ ]+\.(?:png|jpe?g|webp|gif)(?:\?[^"'<>\\ ]*)?)(?:"|')''',re.I)
            for m in imgpat.finditer(text):
              u=m.group(1).replace("\\/","/")
              full=urljoin(base,u)
              un=norm(full)
              if any(b in un for b in BAD): continue
              score=0
              if modeln and modeln in un: score=160
              elif model_positions:
                dist=min(abs(m.start()-p) for p in model_positions)
                if dist<1200: score=150-dist/100
                elif dist<3500: score=128-dist/300
              elif page_specific: score=78
              if score: c.append((score,full,"raw-near-model"))
            # JSON-LD
            for tag in soup.find_all("script",attrs={"type":lambda x:x and "ld+json" in x.lower()}):
              try:
                found=[]; walk_json(json.loads(tag.string or tag.get_text()),modeln,found,False)
                for sc,u,why in found:c.append((sc,urljoin(base,u),why))
              except: pass
            # if exact detail page and only one meaningful image, allow it
            uniq0={}
            for s,u,w in c:
              if any(b in norm(u) for b in BAD): continue
              if u not in uniq0 or s>uniq0[u][0]: uniq0[u]=(s,w)
            if page_specific and len(uniq0)==1:
              u,(s,w)=next(iter(uniq0.items())); uniq0[u]=(max(s,100),"single-image-exact-page")
            return sorted(((s,u,w) for u,(s,w) in uniq0.items()),reverse=True),page_specific

          def js_text_candidates(text,base,modeln):
            pos=[]
            # use exact record model string normalized by scanning nearby raw tokens
            # first, find human-readable variants based on chunks matching model alnum tokens
            toks=re.findall(r"[A-Za-z0-9][A-Za-z0-9+_.-]{2,}",text)
            # cheaper: test image occurrences and nearby normalized text window
            pat=re.compile(r'''(?:"|')([^"'<>\\ ]+\.(?:png|jpe?g|webp|gif)(?:\?[^"'<>\\ ]*)?)(?:"|')''',re.I)
            c=[]
            for m in pat.finditer(text):
              u=m.group(1).replace("\\/","/")
              full=urljoin(base,u)
              un=norm(full)
              if any(b in un for b in BAD): continue
              if modeln and modeln in un: c.append((170,full,"js-url-model")); continue
              a=max(0,m.start()-2600); b=min(len(text),m.end()+2600)
              if modeln and modeln in norm(text[a:b]):
                c.append((145,full,"js-near-model"))
            return sorted(c,reverse=True)

          def one(item):
            idx,rid=item["index"],item["id"]
            try: rec=json.loads((root/"public/robot-library/records"/f"{rid}.json").read_text())
            except Exception as e:return {"index":idx,"id":rid,"ok":False,"error":f"record:{e}"}
            name=rec.get("name") or rec.get("model") or rid
            modeln=norm(name)
            urls=rec_urls(rec)
            if not urls:return {"index":idx,"id":rid,"name":name,"ok":False,"error":"no-official-url"}
            errors=[]
            for url in urls[:5]:
              try:
                r=get(url,timeout=18)
              except Exception as e:
                errors.append(f"{url}:GET:{type(e).__name__}:{e}"); continue
              ctype=(r.headers.get("Content-Type") or "").lower()
              final=r.url
              # direct image
              if "image/" in ctype or pathlib.Path(urlparse(final).path).suffix.lower() in IMG_EXT:
                try:
                  ans=save_img(rec,idx,r.content,final,ctype,"direct-official-image",180)
                  return {"index":idx,"id":rid,"name":name,"page":url,**ans}
                except Exception as e: errors.append(f"{url}:direct:{e}")
              # PDF
              if "pdf" in ctype or final.lower().split("?")[0].endswith(".pdf"):
                ans,err=pdf_candidate(rec,idx,r,final,modeln)
                if ans:return {"index":idx,"id":rid,"name":name,"page":url,**ans}
                errors.append(f"{url}:{err}"); continue
              # JSON API
              if "json" in ctype or final.lower().endswith(".json") or "/api/" in final:
                try:
                  obj=r.json(); found=[]; walk_json(obj,modeln,found,False)
                  for sc,u,why in sorted(found,reverse=True)[:10]:
                    full=urljoin(final,u)
                    try:
                      ir=get(full,referer=final,timeout=12)
                      ans=save_img(rec,idx,ir.content,ir.url,ir.headers.get("Content-Type",""),why,sc)
                      return {"index":idx,"id":rid,"name":name,"page":url,**ans}
                    except Exception as e: errors.append(f"{full}:jsonimg:{e}")
                except Exception as e: errors.append(f"{url}:json:{e}")
              # HTML / JS / text
              text=r.text
              if final.lower().endswith(".js") or "javascript" in ctype:
                cand=js_text_candidates(text,final,modeln); page_specific=True
              else:
                cand,page_specific=html_candidates(text,final,modeln,name)
              # extra API JSON embedded in text
              for sc,u,why in cand[:14]:
                if sc < (100 if page_specific else 125): continue
                try:
                  ir=get(u,referer=final,timeout=12)
                  ans=save_img(rec,idx,ir.content,ir.url,ir.headers.get("Content-Type",""),why,sc)
                  return {"index":idx,"id":rid,"name":name,"page":url,**ans}
                except Exception as e: errors.append(f"{u}:img:{type(e).__name__}:{e}")
              errors.append(f"{url}:no-usable-candidate:{len(cand)} specific={page_specific}")
            return {"index":idx,"id":rid,"name":name,"ok":False,"error":" | ".join(errors)[-4000:]}

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex:
            fs=[ex.submit(one,x) for x in entries]
            for n,f in enumerate(concurrent.futures.as_completed(fs),1):
              try:r=f.result()
              except Exception as e:r={"ok":False,"error":f"worker:{type(e).__name__}:{e}"}
              results.append(r); print(json.dumps(r,ensure_ascii=False),flush=True)
              if n%25==0: print(f"PROGRESS {n}/{len(entries)}",flush=True)
          results.sort(key=lambda x:x.get("index",99999))
          ok=sum(bool(x.get("ok")) for x in results)
          report={"requested":len(entries),"success":ok,"failed":len(entries)-ok,"results":results}
          (out/"_pass2-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(f"SUMMARY success={ok} failed={len(entries)-ok}")
          PY
      - name: Upload pass 2 originals
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-component-pass2
          path: component-pass2/
          if-no-files-found: error
          retention-days: 1
