name: Aegis debug LH-TC product image
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-debug-lhtc.yml"
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet beautifulsoup4==4.14.2 requests==2.32.5
      - name: Inspect exact LH-TC product gallery DOM
        shell: bash
        run: |
          python3 - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          u="https://www.zzlhjqr.com/ltc-36.html"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=20)
          s=BeautifulSoup(r.text,"html.parser")
          imgs=s.find_all("img")
          for i in range(5,11):
            tag=imgs[i]
            print("\nIMAGE",i,tag.get("src"))
            p=tag
            for d in range(6):
              p=p.parent
              if not p: break
              print("PARENT",d,p.name,p.get("class"),p.get("id"))
          PY
