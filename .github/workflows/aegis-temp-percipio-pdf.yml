name: Aegis Percipio official PDF figure recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-percipio-pdf.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests==2.32.5 pymupdf==1.26.5 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests,fitz,hashlib
          from PIL import Image,ImageStat
          out=pathlib.Path("percipio-pdf");out.mkdir(exist_ok=True)
          T=[
            (104,"FM811-TIX","https://doc.percipio.xyz/cam/datasheet/en/FM811-TIX_Specifications.pdf"),
            (109,"FS820-E1","https://doc.percipio.xyz/cam/datasheet/en/FS820-E1_Specifications.pdf"),
            (372,"PM805-E1","https://doc.percipio.xyz/cam/datasheet/en/PM805-E1_Specifications.pdf"),
            (378,"PS801-E1","https://doc.percipio.xyz/cam/datasheet/en/PS801_Series_Specifications.pdf"),
            (379,"PS801-N-E1","https://doc.percipio.xyz/cam/datasheet/en/PS801_Series_Specifications.pdf"),
            (471,"TL430-E1","https://doc.percipio.xyz/cam/datasheet/en/TL430-E1_Specifications.pdf"),
            (472,"TL460-S1-E1","https://doc.percipio.xyz/cam/datasheet/en/TL460-S1-E1_Specifications.pdf"),
            (473,"TM260-E1","https://doc.percipio.xyz/cam/datasheet/en/TM260-E1_Specifications.pdf"),
            (476,"TM421-E1","https://doc.percipio.xyz/cam/datasheet/en/TM421-E1_Specifications.pdf"),
            (477,"TM461-E2","https://doc.percipio.xyz/cam/datasheet/en/TM461-E2_Specifications.pdf"),
          ]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0","Accept":"application/pdf,*/*"})
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def pix_bytes(doc,xref,smask):
            pix=fitz.Pixmap(doc,xref)
            if smask:
              try:pix=fitz.Pixmap(pix,fitz.Pixmap(doc,smask))
              except:pass
            if pix.n>4:pix=fitz.Pixmap(fitz.csRGB,pix)
            return pix.tobytes("png")
          def score_img(b):
            try:
              im=Image.open(io.BytesIO(b)).convert("RGB");w,h=im.size
              if w<120 or h<80 or len(b)<1200:return None
              if max(w/h,h/w)>6:return None
              sm=im.copy();sm.thumbnail((96,96));st=ImageStat.Stat(sm)
              var=sum(st.var);ch=max(st.mean)-min(st.mean)
              return w*h + len(b)*3 + var*100 + ch*200,w,h
            except:return None
          rows=[]
          for idx,name,url in T:
            row={"index":idx,"name":name,"url":url,"ok":False,"candidates":[]}
            try:
              r=S.get(url,timeout=40);r.raise_for_status()
              if not r.content.startswith(b"%PDF"):raise ValueError(f"not-pdf {r.headers.get('content-type')} {len(r.content)}")
              d=fitz.open(stream=r.content,filetype="pdf")
              n=norm(name);pages=[]
              for p in range(min(5,len(d))):
                try:t=d[p].get_text("text")
                except:t=""
                if n in norm(t) or (p==0 and not pages):pages.append(p)
              pages=list(dict.fromkeys(pages or [0]))
              pool=[]
              for p in pages[:3]:
                for im in d[p].get_images(full=True):
                  try:
                    b=pix_bytes(d,im[0],im[1] if len(im)>1 else 0)
                    q=score_img(b)
                    if not q:continue
                    sc,w,h=q
                    pool.append((sc,b,p,im[0],w,h))
                  except:pass
              seen=set()
              for sc,b,p,xref,w,h in sorted(pool,reverse=True,key=lambda x:x[0]):
                hs=hashlib.sha256(b).hexdigest()
                if hs in seen:continue
                seen.add(hs);rank=len(row["candidates"])+1
                fn=f"{idx:03d} - Percipio - {name} - candidate{rank}.png";(out/fn).write_bytes(b)
                row["candidates"].append({"file":fn,"page":p+1,"xref":xref,"dimensions":[w,h],"bytes":len(b),"score":round(sc,2)})
                if rank>=3:break
              row["ok"]=bool(row["candidates"])
              if not row["ok"]:row["error"]="no embedded image candidates"
            except Exception as e:row["error"]=f"{type(e).__name__}:{e}"
            rows.append(row);print(json.dumps(row,ensure_ascii=False),flush=True)
          (out/"_report.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-percipio-pdf
          path: percipio-pdf/
          retention-days: 1
