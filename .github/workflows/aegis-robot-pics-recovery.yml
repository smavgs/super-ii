name: Aegis robot pics recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-robot-pics-recovery.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Recover exact robot images
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, html, json, pathlib, re, subprocess, urllib.parse
          ROOT=pathlib.Path("."); OUT=ROOT/"robot-pics-recovery"; OUT.mkdir(exist_ok=True)
          records=[]
          for p in (ROOT/"public/robot-library/records").glob("*.json"):
              try:r=json.loads(p.read_text())
              except:continue
              if r.get("record_type")=="product" and r.get("category")=="robot": records.append(r)
          records.sort(key=lambda r:(((r.get("makers") or [{}])[0].get("name") or "").lower(),(r.get("name") or "").lower(),r["id"]))

          BAD=("logo","icon","favicon","avatar","placeholder","sprite","loading")
          def norm(s): return re.sub(r"[^a-z0-9]+","",html.unescape(str(s or "")).lower())
          def clean(s):
              s=re.sub(r'[\\/:*?"<>|]+',' - ',str(s or '')).strip()
              return re.sub(r'\s+',' ',s)[:150].strip(" .-") or "Unknown"
          def curl(u,ref=None,timeout=12):
              cmd=["curl","-L","--fail","--silent","--show-error","--connect-timeout","4","--max-time",str(timeout),"-A","Mozilla/5.0 Chrome/155 Safari/537.36"]
              if ref: cmd += ["-e",ref]
              cmd += [u]
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=timeout+3)
              return p.stdout
          def valid(d):
              return len(d)>1000 and (d.startswith(b"\xff\xd8\xff") or d.startswith(b"\x89PNG\r\n\x1a\n") or (len(d)>=12 and d[:4]==b"RIFF" and d[8:12]==b"WEBP") or d.startswith((b"GIF87a",b"GIF89a")))
          def ext(d,u):
              if d.startswith(b"\xff\xd8\xff"):return ".jpg"
              if d.startswith(b"\x89PNG"):return ".png"
              if len(d)>=12 and d[:4]==b"RIFF" and d[8:12]==b"WEBP":return ".webp"
              if d.startswith((b"GIF87a",b"GIF89a")):return ".gif"
              e=pathlib.Path(urllib.parse.urlparse(u).path).suffix.lower()
              return ".jpg" if e==".jpeg" else e if e in (".jpg",".png",".webp",".gif") else ""
          def save(rec,u,why,ref=None):
              try:
                  if any(x in norm(u) for x in BAD): return None
                  d=curl(u,ref)
                  if not valid(d): return None
                  e=ext(d,u)
                  if not e:return None
                  maker=((rec.get("makers") or [{}])[0].get("name") or "Unknown")
                  name=rec.get("name") or rec.get("model") or rec["id"]
                  fn=f"{clean(maker)} - {clean(name)}{e}"
                  (OUT/fn).write_bytes(d)
                  return {"id":rec["id"],"name":name,"company":maker,"file":fn,"source":u,"evidence":why,"bytes":len(d)}
              except:return None

          # One exact Robotuo directory fetch. Each card is then located by the immutable record UUID.
          robotuo_url="https://www.robotuo.com/robots/"
          robotuo=curl(robotuo_url,timeout=25).decode("utf-8","ignore")
          print("ROBOTUO_HTML_BYTES",len(robotuo),flush=True)

          def attr(tag,key):
              m=re.search(r'\b'+re.escape(key)+r'\s*=\s*([\'"])(.*?)\1',tag,re.I|re.S)
              return html.unescape(m.group(2)) if m else ""

          def mirror_candidates(rec):
              rid=rec["id"]; target=norm(rec.get("name") or rec.get("model"))
              maker=norm(((rec.get("makers") or [{}])[0].get("name") or ""))
              out=[]
              for m in re.finditer(re.escape(rid),robotuo,re.I):
                  pos=m.start()
                  # Use the nearest anchor/card containing this exact UUID.
                  st=robotuo.rfind("<a",max(0,pos-3000),pos+1)
                  en=robotuo.find("</a>",pos,min(len(robotuo),pos+7000))
                  if st<0 or en<0: block=robotuo[max(0,pos-2000):min(len(robotuo),pos+3000)]
                  else: block=robotuo[st:en+4]
                  for im in re.finditer(r'<img\b[^>]*>',block,re.I|re.S):
                      tag=im.group(0); src=attr(tag,"src") or attr(tag,"data-src")
                      alt=norm(attr(tag,"alt"))
                      if not src:
                          ss=attr(tag,"srcset")
                          if ss: src=ss.split(",")[0].strip().split()[0]
                      if not src: continue
                      u=(urllib.parse.urljoin("https://www.robotuo.com/",src) if src.startswith("media/") else urllib.parse.urljoin(robotuo_url,src))
                      if any(x in norm(u) for x in BAD): continue
                      score=300
                      if alt and alt==target: score+=300
                      elif target and target in alt: score+=160
                      if "/media/" in u: score+=80
                      if maker and maker in norm(block): score+=40
                      out.append((score,u,alt,block[:250].replace("\n"," ")))
              # Exact-alt candidates first; otherwise exact-ID card image.
              seen=set(); ranked=[]
              for item in sorted(out,reverse=True):
                  if item[1] not in seen:
                      seen.add(item[1]); ranked.append(item)
              return ranked

          # Diagnostic exact IDs known to exist.
          for did in ("7db14f2d-e355-4d4c-aef2-1c8495fc6c57","f939b660-25ed-4a19-baa5-0c9e22ab807b"):
              rr=next((r for r in records if r["id"]==did),None)
              if rr: print("DIAG",did,mirror_candidates(rr)[:3],flush=True)

          def one(rec):
              # 1) reviewed/direct manufacturer asset attached to exact record.
              for im in rec.get("images") or []:
                  if not isinstance(im,dict):continue
                  u=im.get("url") or ""
                  if u.startswith("http"):
                      x=save(rec,u,"manufacturer-record",im.get("source_url"))
                      if x:return x
              # 2) exact Robotuo UUID card; exact name alt preferred, but UUID card binding is sufficient.
              for score,u,alt,_ in mirror_candidates(rec)[:6]:
                  x=save(rec,u,f"robotuo-exact-record-id score={score}",robotuo_url)
                  if x:return x
              return {"id":rec["id"],"name":rec.get("name"),"company":((rec.get("makers") or [{}])[0].get("name") or "Unknown"),"ok":False}

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=48) as ex:
              futs={ex.submit(one,r):r for r in records}
              for f in concurrent.futures.as_completed(futs):
                  x=f.result();results.append(x)
                  print(("OK " if x.get("file") else "MISS ")+x.get("company","")+" - "+str(x.get("name","")),flush=True)
          order={r["id"]:i for i,r in enumerate(records)};results.sort(key=lambda x:order[x["id"]])
          ok=[x for x in results if x.get("file")]; miss=[x for x in results if not x.get("file")]
          report={"total":len(records),"ok":len(ok),"missing":len(miss),"missing_items":[{"id":x["id"],"company":x["company"],"name":x["name"]} for x in miss],"results":results}
          (OUT/"manifest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print("SUMMARY",json.dumps({k:report[k] for k in ("total","ok","missing")}),flush=True)
          if len(records)!=198: raise SystemExit(f"Expected 198 records, found {len(records)}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: robot-pics-recovery
          path: robot-pics-recovery/
          if-no-files-found: error
          retention-days: 1
