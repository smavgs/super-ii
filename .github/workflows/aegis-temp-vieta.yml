name: Aegis Vieta exact recovery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-vieta.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - name: Recover Vieta official product images
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,io,json,pathlib,re
          from urllib.parse import urljoin,urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          out=pathlib.Path("vieta-exact");out.mkdir(exist_ok=True)
          targets=[(135,"GSE-20"),(136,"GSRE-6"),(137,"GTE-25"),(138,"GTRE-12"),(339,"MTHE4-100"),(494,"VZRE-5-100")]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          BAD=("logo","icon","favicon","banner","header","footer","wechat","qr","avatar","arrow","contact","service","news")
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def valid(b):
            try:
              im=Image.open(io.BytesIO(b));im.load();return len(b)>2200 and im.width>=180 and im.height>=120
            except:return False
          def ext(b,u):
            try:f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          def imgurls(tag,base):
            a=[]
            for k in ("src","data-src","data-original","data-lazy-src"):
              v=tag.get(k)
              if isinstance(v,str) and v.strip():a.append(urljoin(base,v))
            return a
          def one(t):
            idx,name=t;n=norm(name)
            try:r=S.get("https://www.vieta-tech.com/",timeout=25);r.raise_for_status()
            except Exception as e:return {"index":idx,"name":name,"ok":False,"error":f"home:{type(e).__name__}:{e}"}
            soup=BeautifulSoup(r.text,"html.parser")
            # crawl first-level product links that mention model or product terms
            pages=[r.url]
            for a in soup.find_all("a",href=True):
              txt=norm(a.get_text(" ",strip=True)); href=urljoin(r.url,a["href"])
              if href.startswith("https://www.vieta-tech.com") and (n in txt or any(k in txt for k in ("product","gse","gsre","gte","gtre","mthe","vzre"))):
                if href not in pages:pages.append(href)
            cand=[]
            for page in pages[:20]:
              try:pr=S.get(page,timeout=18);pr.raise_for_status()
              except:continue
              ps=BeautifulSoup(pr.text,"html.parser");pt=ps.get_text(" ",strip=True)
              if n not in norm(pt):continue
              for s in ps.find_all(string=True):
                if n not in norm(s):continue
                p=s.parent
                for depth in range(8):
                  if not p:break
                  arr=[]
                  for tag in p.find_all("img",limit=20):arr+=imgurls(tag,pr.url)
                  for u in arr:
                    lu=u.lower()
                    if any(x in lu for x in BAD):continue
                    score=5000-depth*250
                    if n in norm(u):score+=1000
                    cand.append((score,u,pr.url,"near-model-block"))
                  if arr:break
                  p=p.parent
              for tag in ps.find_all("img"):
                lab=(tag.get("alt") or "")+" "+(tag.get("title") or "")
                for u in imgurls(tag,pr.url):
                  lu=u.lower()
                  if any(x in lu for x in BAD):continue
                  if n in norm(lab):cand.append((6500,u,pr.url,"exact-alt"))
                  elif n in norm(u):cand.append((6000,u,pr.url,"exact-url"))
            uniq={}
            for s,u,p,w in cand:
              if u not in uniq or s>uniq[u][0]:uniq[u]=(s,p,w)
            best=None
            for u,(score,page,why) in uniq.items():
              try:
                ir=S.get(u,headers={"Referer":page},timeout=15);ir.raise_for_status();b=ir.content
                if not valid(b):continue
                im=Image.open(io.BytesIO(b));w,h=im.size;ratio=max(w/h,h/w)
                if ratio>5:continue
                s2=score*10000000+w*h+len(b)
                if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,page,why,score)
              except:pass
            if not best:return {"index":idx,"name":name,"ok":False,"error":f"no exact image; pages={len(pages)} candidates={len(uniq)}"}
            _,b,u,w,h,page,why,score=best
            fn=f"{idx:03d} - Vieta - {name}{ext(b,u)}";(out/fn).write_bytes(b)
            return {"index":idx,"name":name,"ok":True,"file":fn,"page":page,"source":u,"dimensions":[w,h],"evidence":why,"score":score}
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
            for f in concurrent.futures.as_completed([ex.submit(one,t) for t in targets]):
              try:x=f.result()
              except Exception as e:x={"ok":False,"error":str(e)}
              results.append(x);print(json.dumps(x,ensure_ascii=False),flush=True)
          results.sort(key=lambda x:x.get("index",9999));ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":len(targets),"success":ok,"failed":len(targets)-ok,"results":results},ensure_ascii=False,indent=2))
          print(f"SUMMARY success={ok} failed={len(targets)-ok}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-vieta-exact
          path: vieta-exact/
          retention-days: 1
