name: Aegis Vieta official-site exact recovery
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-vieta.yml"]
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import collections,io,json,pathlib,re
          from urllib.parse import urljoin,urlparse,urldefrag
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          out=pathlib.Path("vieta");out.mkdir(exist_ok=True)
          T=[(135,"GSE-20"),(136,"GSRE-6"),(137,"GTE-25"),(138,"GTRE-12"),(339,"MTHE4-100"),(494,"VZRE-5-100")]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"text/html,image/*,*/*;q=.8"})
          root="https://www.vieta-tech.com/"
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          # Crawl official site up to ~250 internal pages, preferring product/list pages.
          q=collections.deque([(root,0)]);seen=set();pages=[]
          while q and len(seen)<260:
            u,depth=q.popleft();u=urldefrag(u)[0]
            if u in seen:continue
            seen.add(u)
            try:r=S.get(u,timeout=12);r.raise_for_status()
            except:continue
            if "text/html" not in (r.headers.get("content-type") or ""):continue
            pages.append((r.url,r.text))
            if depth>=2:continue
            s=BeautifulSoup(r.text,"html.parser")
            links=[]
            for a in s.find_all("a",href=True):
              v=urljoin(r.url,a["href"]);p=urlparse(v)
              if p.netloc not in ("www.vieta-tech.com","vieta-tech.com"):continue
              if re.search(r'\.(?:pdf|jpg|png|zip|rar|dwg|step)(?:\?|$)',p.path,re.I):continue
              score=0
              if re.search(r'(list_|product|goods|detail|show)',v,re.I):score-=10
              links.append((score,v))
            for _,v in sorted(links)[:120]:
              if v not in seen:q.append((v,depth+1))
          print("CRAWLED",len(pages),flush=True)
          def good(b):
            try:im=Image.open(io.BytesIO(b));im.load();return len(b)>2500 and im.width>=160 and im.height>=120
            except:return False
          def ext(b,u):
            try:f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          R=[]
          for idx,name in T:
            nn=norm(name);matches=[]
            for u,text in pages:
              soup=BeautifulSoup(text,"html.parser");title=soup.title.get_text(" ",strip=True) if soup.title else "";body=soup.get_text(" ",strip=True)
              if nn in norm(title+" "+body):
                exact_title=nn in norm(title)
                matches.append((10 if exact_title else 1,u,text))
            matches.sort(reverse=True)
            best=None
            for page_score,u,text in matches[:10]:
              soup=BeautifulSoup(text,"html.parser");cand=[]
              for i,tag in enumerate(soup.find_all("img")):
                src=tag.get("src") or tag.get("data-src") or tag.get("data-original") or tag.get("data-lazy-src")
                if not src:continue
                iu=urljoin(u,src);lu=iu.lower();label=(tag.get("alt") or "")+" "+(tag.get("title") or "")
                if any(z in lu for z in ("logo","icon","favicon","banner","footer","header","qr","wechat","arrow")):continue
                sc=page_score*1000
                if nn in norm(label):sc+=5000
                elif nn in norm(iu):sc+=4000
                elif i<15:sc+=500-i
                cand.append((sc,iu,label,i))
              for sc,iu,label,i in sorted(cand,reverse=True)[:25]:
                try:
                  ir=S.get(iu,headers={"Referer":u},timeout=12);ir.raise_for_status();b=ir.content
                  if not good(b):continue
                  im=Image.open(io.BytesIO(b));w,h=im.size
                  if max(w/h,h/w)>5:continue
                  s2=sc*10000000+w*h+len(b)
                  if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,u,label,sc)
                except:pass
            if not best:
              x={"index":idx,"name":name,"ok":False,"matched_pages":[m[1] for m in matches[:10]]};R.append(x);print(json.dumps(x,ensure_ascii=False),flush=True);continue
            _,b,iu,w,h,page,label,sc=best
            fn=f"{idx:03d} - Vieta - {name}{ext(b,iu)}";(out/fn).write_bytes(b)
            x={"index":idx,"name":name,"ok":True,"file":fn,"page":page,"source":iu,"dimensions":[w,h],"label":label,"score":sc};R.append(x);print(json.dumps(x,ensure_ascii=False),flush=True)
          ok=sum(x.get("ok",False) for x in R);(out/"_report.json").write_text(json.dumps({"success":ok,"results":R},ensure_ascii=False,indent=2));print("SUMMARY",ok)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: superii-vieta, path: "vieta/", retention-days: 1}
