name: Aegis Vieta exact official recovery v2
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-vieta2.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.2 pillow==12.0.0
      - shell: bash
        run: |
          python3 - <<'PY'
          import io,json,pathlib,re,requests,urllib3
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from PIL import Image
          urllib3.disable_warnings()
          out=pathlib.Path("vieta2");out.mkdir(exist_ok=True)
          targets=[(135,"GSE-20"),(136,"GSRE-6"),(137,"GTE-25"),(138,"GTRE-12"),(339,"MTHE4-100"),(494,"VZRE-5-100")]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0","Accept":"text/html,image/avif,image/webp,image/*,*/*;q=0.8"})
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def good(b):
            try:
              im=Image.open(io.BytesIO(b));im.load();return len(b)>1800 and im.width>=160 and im.height>=100
            except:return False
          def ext(b,u):
            try:f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          def get(u,ref=None):
            h={"Referer":ref} if ref else {}
            r=S.get(u,headers=h,timeout=20,verify=False,allow_redirects=True);r.raise_for_status();return r
          # discover every official product/detail URL from homepage + likely product index pages
          seeds=["https://www.vieta-tech.com/","https://www.vieta-tech.com/list_6/"]
          pages=set()
          for seed in seeds:
            try:
              r=get(seed);s=BeautifulSoup(r.text,"html.parser")
              pages.add(r.url)
              for a in s.find_all("a",href=True):
                u=urljoin(r.url,a["href"])
                if urlparse(u).netloc.endswith("vieta-tech.com") and ("/list_6/" in u or "/product" in u):
                  pages.add(u)
            except:pass
          # probe known nearby IDs because the site uses list_6/<id>.html for product pages
          for i in range(1,120):pages.add(f"https://www.vieta-tech.com/list_6/{i}.html")
          cache={}
          for page in list(pages):
            try:
              r=get(page);txt=BeautifulSoup(r.text,"html.parser").get_text(" ",strip=True)
              cache[r.url]=(r,txt)
            except:pass
          results=[]
          for idx,name in targets:
            n=norm(name);matches=[]
            for page,(r,txt) in cache.items():
              if n in norm(txt):
                s=BeautifulSoup(r.text,"html.parser");cand=[]
                for tag in s.find_all("img"):
                  src=tag.get("src") or tag.get("data-src") or tag.get("data-original")
                  if not src:continue
                  u=urljoin(r.url,src);lab=(tag.get("alt") or "")+" "+(tag.get("title") or "")
                  lu=u.lower()
                  if any(x in lu for x in ("logo","icon","favicon","banner","footer","header","qr","wechat","news")):continue
                  score=0
                  if n in norm(lab):score=5000
                  elif n in norm(u):score=4500
                  elif "product" in lu or "/upload/" in lu or "/uploads/" in lu:score=1000
                  cand.append((score,u,lab))
                best=None
                for score,u,lab in sorted(cand,reverse=True)[:20]:
                  if score<800:continue
                  try:
                    ir=get(u,r.url);b=ir.content
                    if not good(b):continue
                    im=Image.open(io.BytesIO(b));w,h=im.size
                    if max(w/h,h/w)>5:continue
                    s2=score*10000000+w*h+len(b)
                    if best is None or s2>best[0]:best=(s2,b,ir.url,w,h,lab,page,score)
                  except:pass
                if best:matches.append(best)
            if matches:
              best=max(matches,key=lambda x:x[0]);_,b,u,w,h,lab,page,score=best
              fn=f"{idx:03d} - Vieta - {name}{ext(b,u)}";(out/fn).write_bytes(b)
              results.append({"index":idx,"name":name,"ok":True,"file":fn,"page":page,"source":u,"dimensions":[w,h],"label":lab,"score":score})
            else:results.append({"index":idx,"name":name,"ok":False,"error":"no exact official product page/image found"})
          (out/"_report.json").write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-vieta2
          path: vieta2/
          retention-days: 1
