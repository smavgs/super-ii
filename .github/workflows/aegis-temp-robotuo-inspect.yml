name: Aegis inspect Robotuo exact catalogue data
on:
  push:
    branches: [main]
    paths: [".github/workflows/aegis-temp-robotuo-inspect.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests==2.32.5
      - shell: bash
        run: |
          python3 - <<'PY'
          import requests,re,json,pathlib
          out=pathlib.Path("robotuo-inspect");out.mkdir(exist_ok=True)
          u="https://www.robotuo.com/robots/"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36"},timeout=30);r.raise_for_status()
          print("STATUS",r.status_code,"BYTES",len(r.content),"URL",r.url,"CT",r.headers.get("content-type"))
          text=r.text
          names=["FM811-TIX","FS820-E1","LC14","PGC-140-50","CE6G-0.2","WristCam","XCP-040","VZRE-5-100"]
          rows={}
          for name in names:
            positions=[m.start() for m in re.finditer(re.escape(name),text,re.I)]
            arr=[]
            for p in positions[:5]:
              arr.append(text[max(0,p-5000):p+5000])
            rows[name]={"positions":positions[:10],"snippets":arr}
            print("\nMODEL",name,"POSITIONS",positions[:10])
            if arr: print(arr[0][:10000])
          (out/"inspect.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          (out/"page-head.html").write_text(text[:500000])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-robotuo-inspect
          path: robotuo-inspect/
          retention-days: 1
