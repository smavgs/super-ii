name: Aegis ZHAOWEI official datasheet recovery
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-temp-zhaowei-exact.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install --quiet requests==2.32.5 pymupdf==1.26.5 pillow==12.0.0 beautifulsoup4==4.14.2
      - name: Recover ZHAOWEI exact official images
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,io,json,pathlib,re,statistics
          from urllib.parse import urljoin,urlparse
          import requests,fitz
          from PIL import Image,ImageStat
          from bs4 import BeautifulSoup

          root=pathlib.Path(".");out=root/"zhaowei-exact";out.mkdir(exist_ok=True)
          # Current missing manifest may be slightly stale but Drive handles conflicts; only ZHAOWEI records are used.
          manifest=json.loads((root/".aegis-temp/component-images-missing-5.json").read_text())["missing"]
          entries=[x for x in manifest if x.get("manufacturer")=="ZHAOWEI"]
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept":"*/*"})
          PAGE_MAP={
            "MC0623":"https://www.zwgearbox.com/brushless-coreless-motor/6mm-brushless-coreless-motor",
            "MC0818":"https://www.zwgearbox.com/brushless-coreless-motor/8mm-brushless-coreless-motor-2",
            "MC0824":"https://www.zwgearbox.com/brushless-coreless-motor/8mm-brushless-coreless-motor",
            "MC1028":"https://www.zwgearbox.com/brushless-coreless-motor/10mm-brushless-coreless-motor",
            "MC1214":"https://www.zwgearbox.com/brushless-coreless-motor/12mm-brushless-coreless-motor-2",
            "MC1223":"https://www.zwgearbox.com/brushless-coreless-motor/12mm-brushless-coreless-motor-3",
            "MC1226":"https://www.zwgearbox.com/brushless-coreless-motor/12mm-brushless-coreless-motor",
            "MC1237":"https://www.zwgearbox.com/brushless-coreless-motor/12mm-brushless-coreless-motor-4",
            "MC1625":"https://www.zwgearbox.com/brushless-coreless-motor/16mm-brushless-coreless-motor",
            "MC2232":"https://www.zwgearbox.com/brushless-coreless-motor/22-mm-brushless-coreless-motor",
            "MC2250":"https://www.zwgearbox.com/brushless-coreless-motor/22mm-brushless-coreless-motor",
            "MC2643":"https://www.zwgearbox.com/brushless-coreless-motor/26mm-brushless-coreless-motor",
            "ZWSMD008008":"https://www.zwgearbox.com/gear-motors/8mm-gear-motor-2",
          }
          def clean(s):
            s=re.sub(r'[\\/:*?"<>|]+','-',str(s or '')).strip();s=re.sub(r'\s+',' ',s)
            return s[:100].strip(' .-') or "Unknown"
          def norm(s):return re.sub(r"[^a-z0-9]+","",str(s or "").lower())
          def valid_img(b):
            try:
              im=Image.open(io.BytesIO(b));im.load()
              return len(b)>2500 and im.width>=140 and im.height>=100
            except:return False
          def ext_from(b):
            try:
              f=Image.open(io.BytesIO(b)).format.lower();return ".jpg" if f=="jpeg" else "."+f
            except:return ".jpg"
          def photo_score(b,w,h):
            try:
              im=Image.open(io.BytesIO(b)).convert("RGB")
              im.thumbnail((128,128))
              st=ImageStat.Stat(im)
              var=sum(st.var)
              # color difference indicates a photo/render rather than black-line drawing
              means=st.mean
              chroma=max(means)-min(means)
              return w*h + len(b)*4 + var*120 + chroma*200
            except:return w*h+len(b)
          def extract_pdf(name,idx,url):
            r=S.get(url,timeout=25);r.raise_for_status()
            if "pdf" not in (r.headers.get("content-type") or "").lower() and not r.content.startswith(b"%PDF"):
              return None
            d=fitz.open(stream=r.content,filetype="pdf")
            modeln=norm(name); pages=[]
            for p in range(len(d)):
              try:t=d[p].get_text("text")
              except:t=""
              if modeln in norm(t): pages.append(p)
            if not pages: pages=[0]
            best=None
            for p in pages[:3]:
              for im in d[p].get_images(full=True):
                try:
                  z=d.extract_image(im[0]);b=z["image"];w=z.get("width",0);h=z.get("height",0)
                  if not valid_img(b):continue
                  ratio=max(w/h,h/w)
                  if ratio>6:continue
                  sc=photo_score(b,w,h)
                  if best is None or sc>best[0]:best=(sc,b,p,w,h)
                except:pass
            if not best:return None
            _,b,p,w,h=best
            fn=f"{idx:03d} - ZHAOWEI - {clean(name)}{ext_from(b)}";(out/fn).write_bytes(b)
            return {"index":idx,"name":name,"ok":True,"file":fn,"source":url+f"#page={p+1}","dimensions":[w,h],"evidence":"official-zhaowei-datasheet-embedded-image"}
          def page_image(name,idx,url):
            r=S.get(url,timeout=25);r.raise_for_status();s=BeautifulSoup(r.text,"html.parser")
            if norm(name) not in norm(s.get_text(" ",strip=True)):return None
            cand=[]
            for tag in s.find_all("img"):
              src=tag.get("src") or tag.get("data-src") or tag.get("data-original")
              if not src:continue
              u=urljoin(r.url,src);lu=u.lower()
              if any(x in lu for x in ("logo","icon","banner","footer","qr","wechat","avatar")):continue
              label=norm((tag.get("alt") or "")+" "+(tag.get("title") or "")+" "+u)
              boost=100000000 if norm(name) in label else 0
              try:
                ir=S.get(u,headers={"Referer":r.url},timeout=15);ir.raise_for_status();b=ir.content
                if not valid_img(b):continue
                im=Image.open(io.BytesIO(b));w,h=im.size
                sc=boost+photo_score(b,w,h)
                cand.append((sc,b,ir.url,w,h))
              except:pass
            if not cand:return None
            cand.sort(reverse=True,key=lambda x:x[0]);_,b,u,w,h=cand[0]
            fn=f"{idx:03d} - ZHAOWEI - {clean(name)}{ext_from(b)}";(out/fn).write_bytes(b)
            return {"index":idx,"name":name,"ok":True,"file":fn,"source":u,"dimensions":[w,h],"evidence":"official-zhaowei-exact-page-image"}
          def one(it):
            idx,rid=it["index"],it["id"]
            rec=json.loads((root/"public/robot-library/records"/f"{rid}.json").read_text())
            name=rec.get("name") or it.get("name") or rid
            pdfs=[]
            if name=="ZWSMD008008":
              pdfs=["https://www.zwgearbox.com/uploads/2502/zwsmd008008-e.pdf"]
            else:
              pdfs=[f"https://www.zwgearbox.com/uploads/2512/{name.lower()}.pdf"]
            errs=[]
            for u in pdfs:
              try:
                z=extract_pdf(name,idx,u)
                if z:return z
              except Exception as e:errs.append(f"pdf:{type(e).__name__}:{e}")
            u=PAGE_MAP.get(name)
            if u:
              try:
                z=page_image(name,idx,u)
                if z:return z
              except Exception as e:errs.append(f"page:{type(e).__name__}:{e}")
            return {"index":idx,"name":name,"ok":False,"error":" | ".join(errs)[-2000:]}
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            for f in concurrent.futures.as_completed([ex.submit(one,x) for x in entries]):
              try:r=f.result()
              except Exception as e:r={"ok":False,"error":str(e)}
              results.append(r);print(json.dumps(r,ensure_ascii=False),flush=True)
          results.sort(key=lambda x:x.get("index",9999));ok=sum(bool(x.get("ok")) for x in results)
          (out/"_report.json").write_text(json.dumps({"requested":len(entries),"success":ok,"failed":len(entries)-ok,"results":results},ensure_ascii=False,indent=2))
          print(f"SUMMARY success={ok} failed={len(entries)-ok}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: superii-zhaowei-exact
          path: zhaowei-exact/
          retention-days: 1
