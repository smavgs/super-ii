name: Aegis cleanup temporary recovery files
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aegis-cleanup-temp.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Remove temporary Aegis recovery files
        shell: bash
        run: |
          find .github/workflows -maxdepth 1 -type f -name 'aegis-temp-*' -print -delete
          rm -rf .aegis-temp
          rm -f .github/workflows/aegis-cleanup-temp.yml
          git config user.name "aegis-wizard-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git commit -m "chore: remove temporary component image recovery files"
          git push origin HEAD:main
